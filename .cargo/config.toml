[alias]
xtask = "run --package xtask --"

[build]
# The WGPU/shader workspace can exhaust Windows' paging file when Cargo fans
# out across every logical CPU while linking tests and examples. Two jobs keep
# the mandatory workspace gate deterministic on contributor machines and CI.
jobs = 2

[target.wasm32-unknown-unknown]
rustflags = [
    # Enabled unstable APIs from web_sys
    "--cfg=web_sys_unstable_apis",
]
runner = 'wasm-bindgen-test-runner'

[target.aarch64-apple-darwin]
rustflags = [
    # We can guarantee that this target will always run on a CPU with _at least_
    # these capabilities, so let's optimize for them
    "-Ctarget-cpu=apple-m1"
]

[target.'cfg(target_os = "windows")']
rustflags = [
    "--cfg",
    "windows_slim_errors",        # This cfg will reduce the size of `windows::core::Error` from 16 bytes to 4 bytes
]
