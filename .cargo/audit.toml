# Cargo Audit has no per-ignore reason field. Keep every exception mirrored in
# deny.toml, review it when the renderer dependency graph changes, and remove
# it as soon as an upstream-compatible replacement is available.
[advisories]
ignore = [
  # RUSTSEC-2025-0141: bincode 2.0.1 is transitive through librashader-cache
  # 0.12.0; no compatible upstream replacement is available.
  "RUSTSEC-2025-0141",
  # RUSTSEC-2024-0436: paste 1.0.15 is transitive through baremetal 0.33;
  # replacement requires an upstream baremetal release.
  "RUSTSEC-2024-0436",
  # RUSTSEC-2026-0249: smartstring 1.0.1 is transitive through glslang 0.8;
  # replacement requires a reviewed glslang/librashader migration.
  "RUSTSEC-2026-0249",
  # RUSTSEC-2026-0192: ttf-parser 0.25.1 replacement requires the audited
  # renderer/font migration already tracked for the next release line.
  "RUSTSEC-2026-0192",
]

[database]
# Keep advisory data in the same ignored D-drive cache as the local tools.
path = ".automexia-tools/cargo-home/advisory-db"
url = "https://github.com/RustSec/advisory-db.git"
fetch = true
stale = false
