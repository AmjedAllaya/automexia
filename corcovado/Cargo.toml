[package]
name = "corcovado"
publish = false
version = { workspace = true }
license = "MIT"
edition = "2021"
authors = ["Raphael Amorim <rapha850@gmail.com>"]
description = "Non-blocking IO library"
documentation = "https://raphamorim.io/rio/docs"
homepage = "https://github.com/raphamorim/rio"
repository = "https://github.com/raphamorim/rio"
readme = "README.md"
keywords = ["io", "async", "non-blocking"]
categories = ["asynchronous"]
include = [
  "Cargo.toml",
  "src/**/*.rs"
]

[dependencies]
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# miow exposes OVERLAPPED_ENTRY and OVERLAPPED from windows-sys 0.60.
# Keep this exact and retain miow's 0.60.2 edge in Cargo.lock: resolving its
# wider range to 0.61 makes corcovado's direct Win32 types incompatible.
windows-sys = "=0.60.2"
miow = "0.6.1"

[dev-dependencies]
criterion = { workspace = true }
loom = { workspace = true }

[[test]]
name = "test"
path = "test/mod.rs"

[[bench]]
name = "bench_poll"
path = "benches/bench_poll.rs"
harness = false
