[package]
name = "automexia-terminal"
default-run = "automexia"
description = "Automexia Terminal is a hardware-accelerated terminal for modern development workflows."
publish = false
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
keywords.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
build = "build.rs"

[package.metadata.packager]
product-name = "Automexia Terminal"
identifier = "io.github.AmjedAllaya.AutomexiaTerminal"
publisher = "Automexia Contributors"
homepage = "https://github.com/AmjedAllaya/automexia-terminal"
license-file = "../../LICENSE"
copyright = "Copyright 2022-present Raphael Amorim; Copyright 2026-present Automexia Contributors"
formats = ["wix", "app", "dmg", "deb"]
icons = [
    "../../assets/brand/automexia-terminal.ico",
    "../../assets/brand/automexia-terminal.icns",
    "../../assets/brand/png/*.png",
]
resources = ["../../LICENSE", "../../NOTICE.md", "../../THIRD_PARTY_NOTICES.md", "../../README.md", "../../shell-integration"]
binaries = [
    { path = "automexia", main = true },
    { path = "amx" },
    { path = "automexia-suggestion-helper" },
    { path = "automexia-ssh-helper" },
]

[package.metadata.packager.windows]
allow-downgrades = false

[package.metadata.packager.wix]
fragment-paths = ["../../packaging/windows/automexia.wxs"]
component-group-refs = ["AutomexiaContextMenuComponents"]

[[bin]]
name = "automexia"
path = "src/main.rs"

[[bin]]
name = "amx"
path = "src/bin/amx.rs"

[[bin]]
name = "automexia-suggestion-helper"
path = "src/bin/automexia-suggestion-helper.rs"

[[bin]]
name = "automexia-ssh-helper"
path = "src/bin/automexia-ssh-helper.rs"

[dependencies]
accesskit = { workspace = true }
base64 = { workspace = true }
automexia-keybindings = { workspace = true }
automexia-extension-api = { workspace = true }
automexia-extension-runtime = { workspace = true }
automexia-devops = { workspace = true }
automexia-connectivity = { workspace = true }
automexia-ssh-integration = { workspace = true }
automexia-command-productivity = { workspace = true }
automexia-image = { workspace = true }
automexia-ui-model = { workspace = true }
global-hotkey = "0.8.0"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "registry"] }
wgpu = { workspace = true }
rio-backend = { workspace = true }
time = { workspace = true }

[dev-dependencies]
pretty_assertions = "1.4.1"
criterion = { workspace = true }
image_rs = { workspace = true }
insta = { workspace = true }
proptest = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
automexia-ecosystem = { workspace = true }
automexia-ecosystem-runtime = { workspace = true }
bitflags = { workspace = true }
futures = { workspace = true }
corcovado = { workspace = true }
regex = { workspace = true }
onig = { workspace = true }
raw-window-handle = { workspace = true }
rfd = { workspace = true }
clap = { version = "4.6.1", features = ["derive"] }
automexia-devops-ssh = { workspace = true }
automexia-devops-aws = { workspace = true }
automexia-devops-azure = { workspace = true }
automexia-devops-gcp = { workspace = true }
automexia-devops-kubernetes = { workspace = true }
automexia-devops-openshift = { workspace = true }
automexia-devops-teleport = { workspace = true }
blake3 = "1.8.5"
dirs = "7.0.0"
notify = "8.2.0"
rustc-hash = { workspace = true }
rapidhash = { version = "4.4.1", default-features = false }
libc = { workspace = true }
parking_lot = { workspace = true }
process-wrap = { version = "10.0.0", default-features = false, features = ["std", "job-object", "process-group", "creation-flags"] }
serde = { workspace = true }
serde_json = "1.0"
flate2 = { workspace = true }
zeroize = "1.8.2"
sha2 = "0.11.0"
toml = "1.1.4"
tempfile = { workspace = true }
taffy = { version = "=0.14.0", features = ["flexbox","grid"] }
teletypewriter = { workspace = true }
unicode-width = { workspace = true }
# IME composition is shaped UI text; PTY cells keep the separate legacy width contract.
unicode-width-ui = { package = "unicode-width", version = "0.2.2" }
unicode-segmentation = { workspace = true }
url = { workspace = true }
smallvec = { workspace = true }
rio-window = { workspace = true }
rio-notifier = { workspace = true }

[target.'cfg(all(not(target_os = "macos"), not(target_os = "windows")))'.dependencies]
cpal = { version = "0.18", optional = true }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
accesskit_unix = "=0.24.0"

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = "=0.27.1"
objc = { workspace = true }
core-foundation = "0.10.1"
security-framework-sys = "2.17.0"

[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.4.4", default-features = false }
getrandom = "0.4.3"
# The AEAD's zeroize feature does not enable wiping its Poly1305 state.
poly1305 = { version = "0.9.1", features = ["zeroize"] }

[target.'cfg(windows)'.dependencies]
accesskit_windows = "=0.35.1"
ahash = { version = "0.8.12", default-features = false, features = ["std"] }
dunce = "1.0.5"
tinyvec = { version = "1.8.1", features = ["alloc"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Authorization",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_Debug",
]}

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"
# `wgpu` backend is a hard requirement on Windows — there's no native
# DX12/Vulkan-via-ash backend yet, so without it the binary has no
# GPU rendering path. Force it on for Windows builds; Linux/macOS
# builds opt in via `--features wgpu` if they want librashader filters.
[target.'cfg(windows)'.dependencies.sugarloaf]
workspace = true
features = ["wgpu"]
[target.'cfg(windows)'.dependencies.rio-backend]
workspace = true
features = ["wgpu"]
[target.'cfg(target_arch = "wasm32")'.dependencies.sugarloaf]
workspace = true
features = ["wgpu"]
[target.'cfg(target_arch = "wasm32")'.dependencies.rio-backend]
workspace = true
features = ["wgpu"]

[features]
default = ["wayland", "x11"]
application-benchmarks = []
native-gui-test-hooks = ["rio-backend/native-gui-test-hooks", "sugarloaf/native-gui-test-hooks"]
visual-test-hooks = ["native-gui-test-hooks"]
audio = ["cpal"]
x11 = [
    "rio-backend/x11",
    "rio-window/x11"
]
wayland = [
    "rio-backend/wayland",
    "rio-window/wayland",
    "rio-window/wayland-dlopen",
]
wgpu = ["sugarloaf/wgpu", "rio-backend/wgpu"]

[[bench]]
name = "automexia_services"
harness = false

[[bench]]
name = "image_preview"
harness = false

[[bench]]
name = "quick_action_store"
harness = false

[[bench]]
name = "connection_catalog"
harness = false

# "rio-window/wayland-csd-adwaita-crossfont",

[target.'cfg(unix)'.dependencies.chacha20poly1305]
version = "0.11.0"
default-features = false
features = ["alloc", "zeroize"]

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
secret-service = { version = "5.2.0", default-features = false, features = ["rt-async-io-crypto-rust"] }
