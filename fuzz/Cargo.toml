[package]
name = "automexia-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
automexia-extension-api = { path = "../automexia-extension-api", optional = true }
serde_json = { version = "1.0.145", optional = true }
automexia-image = { path = "../automexia-image", optional = true }
automexia-keybindings = { path = "../automexia-keybindings", optional = true }
automexia-terminal = { path = "../apps/automexia-terminal", default-features = false, optional = true }
automexia-devops = { path = "../automexia-devops", optional = true }
automexia-connectivity = { path = "../automexia-connectivity", optional = true }
automexia-command-productivity = { path = "../automexia-command-productivity", optional = true }
automexia-ecosystem = { path = "../automexia-ecosystem", optional = true }
automexia-ecosystem-runtime = { path = "../automexia-ecosystem-runtime", optional = true }
automexia-devops-ssh = { path = "../extensions/devops-ssh", optional = true }
automexia-devops-aws = { path = "../extensions/devops-aws", optional = true }
automexia-devops-azure = { path = "../extensions/devops-azure", optional = true }
automexia-devops-gcp = { path = "../extensions/devops-gcp", optional = true }
automexia-devops-kubernetes = { path = "../extensions/devops-kubernetes", optional = true }
automexia-devops-teleport = { path = "../extensions/devops-teleport", optional = true }
rio-backend = { path = "../rio-backend", default-features = false, optional = true }
rio-vt = { path = "../rio-vt", default-features = false, optional = true }
tempfile = { version = "3.23.0", optional = true }

[features]
default = ["all-targets"]
all-targets = [
    "semantic-surfaces",
    "multicloud-provider-inputs",
    "dep:automexia-image",
    "dep:automexia-keybindings",
    "dep:automexia-terminal",
    "dep:automexia-devops",
    "dep:automexia-connectivity",
    "dep:automexia-command-productivity",
    "dep:automexia-ecosystem",
    "dep:automexia-ecosystem-runtime",
    "dep:automexia-devops-ssh",
    "dep:automexia-devops-aws",
    "dep:automexia-devops-azure",
    "dep:automexia-devops-gcp",
    "dep:automexia-devops-kubernetes",
    "dep:automexia-devops-teleport",
    "dep:rio-backend",
    "dep:rio-vt",
    "dep:tempfile",
]
multicloud-provider-inputs = [
    "dep:automexia-connectivity",
    "dep:automexia-devops-aws",
    "dep:automexia-devops-azure",
    "dep:automexia-devops-gcp",
    "dep:automexia-devops-kubernetes",
    "dep:automexia-devops-teleport",
]
semantic-surfaces = ["dep:automexia-extension-api", "dep:serde_json"]

[workspace]
members = ["."]

[[bin]]
name = "vt_parser"
path = "fuzz_targets/vt_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "osc_metadata"
path = "fuzz_targets/osc_metadata.rs"
test = false
doc = false
bench = false

[[bin]]
name = "control_string_bounds"
path = "fuzz_targets/control_string_bounds.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_migration"
path = "fuzz_targets/config_migration.rs"
test = false
doc = false
bench = false

[[bin]]
name = "semantic_classification"
path = "fuzz_targets/semantic_classification.rs"
test = false
doc = false
bench = false

[[bin]]
name = "label_sanitization"
path = "fuzz_targets/label_sanitization.rs"
test = false
doc = false
bench = false

[[bin]]
name = "image_decoder"
path = "fuzz_targets/image_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "openssh_inventory"
path = "fuzz_targets/openssh_inventory.rs"
test = false
doc = false
bench = false

[[bin]]
name = "quick_action_projection"
path = "fuzz_targets/quick_action_projection.rs"
test = false
doc = false
bench = false

[[bin]]
name = "quick_action_packs"
path = "fuzz_targets/quick_action_packs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "quick_action_imports"
path = "fuzz_targets/quick_action_imports.rs"
test = false
doc = false
bench = false

[[bin]]
name = "connection_planning"
path = "fuzz_targets/connection_planning.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ghostty_keybindings"
path = "fuzz_targets/ghostty_keybindings.rs"
