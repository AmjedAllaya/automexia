[package]
name = "automexia-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
automexia-image = { path = "../automexia-image" }
automexia-devops = { path = "../automexia-devops" }
automexia-devops-ssh = { path = "../extensions/devops-ssh" }
rio-backend = { path = "../rio-backend", default-features = false }
rio-vt = { path = "../rio-vt", default-features = false }
tempfile = "3.23.0"

[workspace]
members = ["."]

[[bin]]
name = "vt_parser"
path = "fuzz_targets/vt_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "osc_metadata"
path = "fuzz_targets/osc_metadata.rs"
test = false
doc = false
bench = false

[[bin]]
name = "control_string_bounds"
path = "fuzz_targets/control_string_bounds.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_migration"
path = "fuzz_targets/config_migration.rs"
test = false
doc = false
bench = false

[[bin]]
name = "semantic_classification"
path = "fuzz_targets/semantic_classification.rs"
test = false
doc = false
bench = false

[[bin]]
name = "label_sanitization"
path = "fuzz_targets/label_sanitization.rs"
test = false
doc = false
bench = false

[[bin]]
name = "image_decoder"
path = "fuzz_targets/image_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "openssh_inventory"
path = "fuzz_targets/openssh_inventory.rs"
test = false
doc = false
bench = false

[[bin]]
name = "quick_action_projection"
path = "fuzz_targets/quick_action_projection.rs"
test = false
doc = false
bench = false

[[bin]]
name = "quick_action_packs"
path = "fuzz_targets/quick_action_packs.rs"
test = false
doc = false
bench = false