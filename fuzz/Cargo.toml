doc = false
bench = false

[[bin]]
name = "ecosystem_bundle"
path = "fuzz_targets/ecosystem_bundle.rs"
test = false
doc = false
bench = false

[[bin]]
name = "semantic_surfaces"
path = "fuzz_targets/semantic_surfaces.rs"
test = false
doc = false
bench = false
required-features = ["semantic-surfaces"]
