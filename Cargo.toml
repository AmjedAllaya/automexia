[workspace]
members = [
    "automexia-keybindings",
    "automexia-extension-api",
    "automexia-extension-runtime",
    "automexia-ecosystem",
    "automexia-ecosystem-runtime",
    "automexia-connectivity",
    "automexia-command-productivity",
    "automexia-devops",
    "extensions/devops-aws",
    "extensions/devops-azure",
    "extensions/devops-gcp",
    "extensions/devops-kubernetes",
    "extensions/devops-openshift",
    "extensions/devops-teleport",
    "extensions/devops-ssh",
    "automexia-image",
    "automexia-ui-model",
    "sugarloaf",
    "teletypewriter",
    "corcovado",
    "rio-graphics",
    "rio-fonts",
    "rio-vt",
    "rio-backend",
    "rio-grapheme-width",
    "rio-window",
    "rio-notifier",
    "apps/automexia-terminal",
    "librio",
    "librio-wasm",
    "tools/xtask",
]
resolver = "2"

[workspace.package]
version = "0.4.0"
authors = [
    "Automexia Contributors",
    "Raphael Amorim <rapha850@gmail.com>",
]
edition = "2021"
license = "MIT"
keywords = ["graphics", "terminal", "application"]
rust-version = "1.96.1"
repository = "https://github.com/AmjedAllaya/automexia-terminal"
homepage = "https://github.com/AmjedAllaya/automexia-terminal"
documentation = "https://github.com/AmjedAllaya/automexia-terminal/tree/main/docs"
readme = "README.md"

[workspace.metadata.automexia]
product-name = "Automexia Terminal"
package-name = "automexia-terminal"
frontend-path = "apps/automexia-terminal"
executable = "automexia"
application-id = "io.github.AmjedAllaya.AutomexiaTerminal"
url-scheme = "automexia"
wm-class = "AutomexiaTerminal"
term-program = "Automexia"
config-home-environment = "AUTOMEXIA_CONFIG_HOME"
log-level-environment = "AUTOMEXIA_LOG_LEVEL"
shell-integration-environment = "AUTOMEXIA_SHELL_INTEGRATION"

[workspace.dependencies]
automexia-keybindings = { path = "automexia-keybindings", version = "0.4.0" }
automexia-extension-api = { path = "automexia-extension-api", version = "0.4.0" }
automexia-extension-runtime = { path = "automexia-extension-runtime", version = "0.4.0" }
automexia-ecosystem = { path = "automexia-ecosystem", version = "0.4.0" }
automexia-ecosystem-runtime = { path = "automexia-ecosystem-runtime", version = "0.4.0" }
automexia-connectivity = { path = "automexia-connectivity", version = "0.4.0" }
automexia-command-productivity = { path = "automexia-command-productivity", version = "0.4.0" }
automexia-devops = { path = "automexia-devops", version = "0.4.0" }
automexia-devops-aws = { path = "extensions/devops-aws", version = "0.4.0" }
automexia-devops-azure = { path = "extensions/devops-azure", version = "0.4.0" }
automexia-devops-gcp = { path = "extensions/devops-gcp", version = "0.4.0" }
automexia-devops-kubernetes = { path = "extensions/devops-kubernetes", version = "0.4.0" }
automexia-devops-openshift = { path = "extensions/devops-openshift", version = "0.4.0" }
automexia-devops-teleport = { path = "extensions/devops-teleport", version = "0.4.0" }
automexia-devops-ssh = { path = "extensions/devops-ssh", version = "0.4.0" }
automexia-image = { path = "automexia-image", version = "0.4.0" }
automexia-ui-model = { path = "automexia-ui-model", version = "0.4.0" }

# Note: https://doc.rust-lang.org/cargo/reference/specifying-dependencies.html#multiple-locations
# Sugarloaf example uses path when used locally, but uses
# version from crates.io when published.
teletypewriter = { path = "teletypewriter", version = "0.4.0" }
rio-backend = { path = "rio-backend", version = "0.4.0" }
rio-window = { path = "rio-window", version = "0.4.0", default-features = false }
rio-notifier = { path = "rio-notifier", version = "0.4.0" }
rio-grapheme-width = { path = "rio-grapheme-width", version = "0.4.0" }
sugarloaf = { path = "sugarloaf", version = "0.4.0" }
corcovado = { path = "corcovado", version = "0.4.0" }
rio-graphics = { path = "rio-graphics", version = "0.4.0" }
rio-fonts = { path = "rio-fonts", version = "0.4.0" }
rio-vt = { path = "rio-vt", version = "0.4.0" }

raw-window-handle = { version = "0.6.2", features = ["std"] }
rfd = { version = "=0.17.2" }
parking_lot = { version = "0.12.5", features = [
    "nightly",
    "hardware-lock-elision",
] }
rustc-hash = "2.1.3"
smallvec = { version = "1.15.2", default-features = false }

# unicode-width = "0.2.0"
unicode-width = { package = "unicode-width-16", version = "0.1.0" }
unicode-segmentation = "1.13.3"
unicode-normalization = "0.1.25"
simdutf = "0.7.0"
base64 = "0.23.0"
image_rs = { package = "image", version = "0.25.10", default-features = false, features = [
    "gif",
    "jpeg",
    "ico",
    "png",
    "pnm",
    "webp",
    "bmp",
    "tiff",
] }
regex = "1.12.3"
onig = { version = "6.5.3", default-features = false }
bytemuck = { version = "1.25.2", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
serde-saphyr = { version = "=1.1.0", default-features = false, features = ["deserialize"] }
sha2 = "0.11.0"
tempfile = "3.23.0"
glob = "0.3.4"
notify = "8.2.0"
wgpu = "30.0.0"
libc = "0.2.189"
smol_str = "0.3.2"
futures = "0.3.31"
zbus = "5.18.0"
wasm-bindgen = "0.2.87"
wasm-bindgen-futures = "0.4.34"
wasm-bindgen-test = "0.3.42"
env_logger = "0.11.8"
console_log = "1.1.0"
bitflags = "2.9.0"
console_error_panic_hook = "0.1.7"
tracing = "0.1.41"
objc = { package = "objc-rs", version = "0.3.2" }
memmap2 = "0.9.11"
url = "2.5.4"
criterion = { version = "0.8.2", features = ["html_reports"] }
insta = { version = "1.48.0", features = ["json", "redactions"] }
loom = "0.7.2"
proptest = "1.11.0"
dashmap = "6.2.1"
flate2 = "1.1.9"
configparser = { version = "3.2.0", default-features = false }
time = { version = "=0.3.55", default-features = false, features = ["std", "parsing"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc", "fast", "zeroize"] }
wasmtime = { version = "48.0.1", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "wat"] }
wit-parser = "=0.258.0"
wat = "=1.258.0"

[profile.release]
strip = "symbols"           # See split-debuginfo - allows us to drop the size by ~65%
debug = "full"              # No one needs an undebuggable release binary
split-debuginfo = "packed"  # generates a separate *.dwp/*.dSYM so the binary can get stripped
lto = true
panic = "abort"             # reduces binary size by ~50% in combination with -Zbuild-std-features=panic_immediate_abort
codegen-units = 1
incremental = false

[profile.librio]
inherits = "release"
strip = "none"
debug = false
lto = false

[profile.dev]
split-debuginfo = "unpacked"
# Preserve source-level backtraces without the very large full-debug Windows
# link that made the first everyday Automexia launch take several minutes.
debug = 1
lto = false
opt-level = 0
incremental = true

# Shell line editors can repaint the active prompt several times for one
# history-navigation key. Keep the VT parser/reflow hot path representative of
# shipped builds without slowing incremental compilation for every crate.
[profile.dev.package.rio-vt]
opt-level = 2

[profile.test]
debug = 1
# Test and all-target verification artifacts are short-lived. Incremental test
# graphs multiply storage across check, Clippy, examples, and harness binaries
# without helping the persistent everyday Automexia application build.
incremental = false
