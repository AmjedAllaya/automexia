name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  AUTOMEXIA_RUST_TOOLCHAIN: '1.98.0'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    name: Repository and workflow policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce immutable external Action pins
        run: python3 .github/scripts/check_action_pins.py

      - name: Enforce GitHub-Free/private CI contract
        run: python3 .github/scripts/check_free_plan_contract.py

      - name: Validate repository-owned assurance policies
        run: |
          set -euo pipefail
          python tools/ci/github_free_assurance.py check-policy
          python tools/ci/check_feature_test_reinforcement.py

      - name: Install actionlint 1.7.12 and ShellCheck 0.11.0 with checksum verification
        shell: bash
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
          SHELLCHECK_VERSION: '0.11.0'
          SHELLCHECK_SHA256: 'b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6'
        run: |
          set -euo pipefail
          actionlint_archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          shellcheck_archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          curl --fail --silent --show-error --location --output "$actionlint_archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${actionlint_archive}"
          curl --fail --silent --show-error --location --output "$shellcheck_archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${shellcheck_archive}"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$actionlint_archive" | sha256sum -c -
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$shellcheck_archive" | sha256sum -c -
          tar -xzf "$actionlint_archive" actionlint
          tar -xzf "$shellcheck_archive" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          install -m 0755 actionlint "$RUNNER_TEMP/actionlint"
          install -m 0755 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$RUNNER_TEMP/shellcheck"

      - name: Validate GitHub Actions syntax and expressions
        run: |
          "$RUNNER_TEMP/actionlint" -color -shellcheck "$RUNNER_TEMP/shellcheck"

      - name: Install pinned zizmor 1.21.0
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026
        with:
          tool: zizmor@1.21.0
          fallback: none

      - name: Audit GitHub Actions security with zizmor
        shell: bash
        run: |
          set -euo pipefail
          zizmor \
            --collect workflows \
            --strict-collection \
            --persona auditor \
            --min-severity high \
            --min-confidence medium \
            --no-online-audits \
            --format github \
            .

      - name: Install pinned Python assurance tools
        run: >-
          python3 -m pip install --disable-pip-version-check --no-input
          PyYAML==6.0.3 semgrep==1.175.0

      - name: Validate all repository formats and CI contracts
        run: python3 tools/ci/validate_repository.py

      - name: Execute the complete Python CI contract and mutation suite
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py'

      - name: Scan Rust source with local Semgrep rules
        run: >-
          semgrep scan --config tools/ci/semgrep-rules.yml --error --metrics=off
          --exclude tests/fixtures/free-assurance/semgrep .

      - name: Prove Semgrep rules detect their canary
        run: python3 tools/ci/test_free_security_tools.py --tool semgrep

  quality:
    name: Rust quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$AUTOMEXIA_RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$AUTOMEXIA_RUST_TOOLCHAIN"

      - name: Install native Linux build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          glslang-tools libasound2-dev libfontconfig1-dev libxkbcommon-dev
          libwayland-dev libx11-xcb-dev shellcheck zsh fish

      - name: Cache Cargo registry and Git sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ci-linux-${{ hashFiles('Cargo.lock') }}

      - name: Install pinned test runner
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026
        with:
          tool: cargo-nextest@0.9.137

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Workspace unit and integration tests
        run: cargo nextest run --workspace --all-features --locked --profile ci

      - name: QA runner contract mutations
        run: python3 tools/ci/test_qa.py

      - name: Deterministic Loom channel model
        run: cargo test -p corcovado --test loom_channel_readiness --locked
        env:
          RUSTFLAGS: --cfg loom --check-cfg=cfg(loom)

      - name: Image rendering and resource regression
        run: cargo xtask test image-rendering

      - name: Workspace documentation tests
        run: cargo test --workspace --all-features --doc --locked

      - name: Shell integration syntax and contract smoke
        run: bash tools/ci/test_shell_sources.sh

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust security tools
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026
        with:
          tool: cargo-audit@0.22.0,cargo-deny@0.20.2,cargo-vet@0.10.2

      - name: RustSec audit
        run: cargo audit --deny warnings

      - name: Dependency, license, and source policy
        run: cargo deny --locked --color never check --hide-inclusion-graph

      - name: Dependency audit trust policy
        run: cargo vet --locked

      - name: Install Gitleaks 8.30.1 with checksum verification
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          install -m 0755 gitleaks "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan introduced commits and working tree for secrets
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          log_opts=HEAD
          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "push" ]] \
            && [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && [[ ! "$BASE_SHA" =~ ^0{40}$ ]] \
            && [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            log_opts="${BASE_SHA}..${HEAD_SHA}"
          fi
          gitleaks git --redact --no-banner --timeout=900 --max-target-megabytes=16 --config .gitleaks.toml --log-opts="$log_opts"
          gitleaks dir --redact --no-banner --timeout=900 --max-target-megabytes=16 --config .gitleaks.toml .

      - name: Prove Gitleaks detects its committed canary
        run: python3 tools/ci/test_free_security_tools.py --tool gitleaks

  release-candidate:
    name: Release candidate gate
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate internal release branch, SemVer, version, and protected paths
        shell: bash
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_REPO" == "$GITHUB_REPOSITORY" ]] || { echo 'Release PRs must originate from this repository, never a fork.' >&2; exit 1; }
          [[ "$HEAD_BRANCH" =~ ^release/([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo 'Release branch must be exactly release/X.Y.Z.' >&2; exit 1; }
          version="${HEAD_BRANCH#release/}"
          rustup toolchain install "$AUTOMEXIA_RUST_TOOLCHAIN" --profile minimal
          rustup default "$AUTOMEXIA_RUST_TOOLCHAIN"
          actual="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "automexia-terminal") | .version' | head -1)"
          [[ "$actual" == "$version" ]] || { echo "release/$version does not match automexia-terminal version '$actual'." >&2; exit 1; }
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/release-files.txt"
          if grep -Eq '^(\.github/|tools/ci/|tools/xtask/|packaging/|shell-integration/)' "$RUNNER_TEMP/release-files.txt"; then
            echo 'A release PR may not modify CI/release trust, packaging, shell-integration, or xtask implementation. Merge those changes separately before cutting the release.' >&2
            cat "$RUNNER_TEMP/release-files.txt" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "Tag v$version already exists." >&2
            exit 1
          fi

  release-candidate-coverage:
    name: Release candidate Windows coverage
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - quality
      - release-candidate
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      COVERAGE_PLATFORM: windows-x86_64-msvc
      LCOV_FILE: target/coverage/lcov.info
      COVERAGE_SUMMARY: target/coverage/summary.json
    steps:
      - name: Check out release candidate with complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust coverage toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:AUTOMEXIA_RUST_TOOLCHAIN --profile minimal --component llvm-tools-preview
          if ($LASTEXITCODE -ne 0) { throw 'Rust coverage toolchain installation failed' }
          rustup default $env:AUTOMEXIA_RUST_TOOLCHAIN
          if ($LASTEXITCODE -ne 0) { throw 'Rust coverage toolchain activation failed' }

      - name: Install pinned coverage tool
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026
        with:
          tool: cargo-llvm-cov@0.6.18

      - name: Enforce commit-bound Windows coverage regression baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/coverage | Out-Null
          cargo llvm-cov --workspace --locked --lcov --output-path $env:LCOV_FILE
          if ($LASTEXITCODE -ne 0) { throw 'coverage collection failed' }
          python tools/ci/check_coverage.py
          if ($LASTEXITCODE -ne 0) { throw 'coverage policy failed' }
