name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  policy:
    name: Policy and repository contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: policy-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Install repository format validators
        run: sudo apt-get update && sudo apt-get install -y python3-yaml shellcheck zsh fish
      - name: Repository contracts
        run: cargo xtask verify all
      - name: Validate TOML, YAML, JSON, XML, and desktop metadata
        run: python tools/ci/validate_repository.py
      - name: Command productivity CP0 policy mutation tests
        run: python tools/ci/test_command_productivity.py
      - name: Command productivity CP1 activation mutation tests
        run: python tools/ci/test_command_productivity_cp1.py
      - name: Planned CP2/CP3 alias specification mutation tests
        run: python tools/ci/test_devops_alias_spec.py
      - name: Completion adapter benchmark contract tests
        run: python tools/ci/test_measure_completion_adapter.py
      - name: QA evidence runner contracts
        run: python tools/ci/test_qa.py
      - name: Cross-platform workflow coverage regression tests
        run: |
          python tools/ci/check_platform_coverage.py
          python tools/ci/test_platform_coverage.py
      - name: Runtime and release trust mutation tests
        run: |
          python tools/ci/check_runtime_trust.py
          python tools/ci/test_runtime_trust.py
      - name: Release trust policy and artifact mutation tests
        run: |
          python tools/ci/release_trust.py --check-policy
          python tools/ci/test_release_trust.py
      - name: Feature assurance traceability regression tests
        run: |
          python tools/ci/check_feature_assurance.py
          python tools/ci/test_feature_assurance.py
      - name: Documentation source-registry coverage tests
        run: |
          python tools/ci/check_documentation_coverage.py
          python tools/ci/test_documentation_coverage.py
      - name: Roadmap phase-audit coverage tests
        run: |
          python tools/ci/check_phase_implementation_audit.py
          python tools/ci/test_phase_implementation_audit.py
      - name: Shell syntax
        run: bash tools/ci/test_shell_sources.sh
      - name: PowerShell syntax
        shell: pwsh
        run: tools/ci/test_powershell.ps1 -SyntaxOnly
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: lychee@0.20.1
      - name: Markdown links
        run: lychee --offline --no-progress '**/*.md'
      - name: Collect approvals
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          approvals=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/reviews" --paginate --slurp --jq '[add | group_by(.user.login)[] | sort_by(.submitted_at) | last | select(.state == "APPROVED") | .user.login] | unique | join(",")')
          echo "APPROVAL_LOGINS=$approvals" >> "$GITHUB_ENV"
      - name: PR title, DCO, changelog, and protected reviews
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python tools/ci/check_pr_policy.py

  native:
    name: Native ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y glslang-tools libasound2-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-xcb-dev shellcheck zsh fish
      - name: Install macOS shell validator
        if: runner.os == 'macOS'
        run: brew install shellcheck fish
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: native-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: cargo-nextest@0.9.137
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Workspace unit and integration tests
        run: cargo nextest run --workspace --all-features --locked --profile ci
      - name: Workspace documentation tests
        run: cargo test --workspace --all-features --doc --locked
      - name: Native Unix shell install, repair, and prompt contracts
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: bash tools/ci/test_shell_sources.sh
      - name: Native librio C ABI compile, link, and runtime smoke
        if: runner.os == 'Linux'
        run: bash tools/ci/test_librio_c_api.sh
      - name: Finite channel readiness model
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: --cfg loom --check-cfg=cfg(loom)
        run: cargo test -p corcovado --test loom_channel_readiness --locked
      - name: Phase 1 extension lifecycle and isolation models
        if: runner.os == 'Linux'
        run: cargo test -p automexia-extension-runtime --lib --locked
      - name: Image rendering security, resilience, and performance contracts
        if: runner.os == 'Linux'
        run: cargo xtask test image-rendering
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nextest-junit-${{ runner.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 14
      - name: Deterministic prompt resize and history-repaint stress
        if: runner.os == 'Windows'
        run: cargo xtask test resize-stress
      - name: Session-clone descriptors, bindings, isolation, and Windows quoting
        if: runner.os == 'Windows'
        run: cargo xtask test session-clone
      - name: Native PowerShell and CMD integration contracts
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/ci/test_powershell.ps1
      - if: runner.os == 'Linux'
        run: cargo doc --workspace --no-deps --locked

  linux-features:
    name: Linux ${{ matrix.features }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - features: x11
            args: --no-default-features --features x11
          - features: wayland
            args: --no-default-features --features wayland
          - features: x11-wayland
            args: --features x11,wayland
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y glslang-tools libasound2-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-xcb-dev
      - run: cargo check -p automexia-terminal --all-targets --locked ${{ matrix.args }}

  cross-checks:
    name: Cross-check ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup target add ${{ matrix.target }}
      - run: cargo check -p automexia-terminal --locked --target ${{ matrix.target }}

  coverage:
    name: Coverage
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: cargo-llvm-cov@0.6.21
      - run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COVERAGE_PLATFORM: windows-x86_64-msvc
        run: python tools/ci/check_coverage.py
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: lcov.info
          fail_ci_if_error: false

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked --color never check --hide-inclusion-graph

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
