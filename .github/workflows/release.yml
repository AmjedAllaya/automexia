name: Stable release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  native-gui-resilience:
    name: Release Windows GUI resize and clone resilience
    if: vars.AUTOMEXIA_NATIVE_GUI_RUNNER == '1'
    runs-on: [self-hosted, Windows, X64, automexia-gpu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Exercise prompt history, independent clones, ConPTY, and resize storms
        shell: pwsh
        run: cargo xtask test session-clone --native-windows

  native-wsl-resilience:
    name: Release WSL clone identity and resize resilience
    if: vars.AUTOMEXIA_WSL_RUNNER == '1'
    runs-on: [self-hosted, Windows, X64, automexia-wsl]
    env:
      AUTOMEXIA_TEST_WSL_DISTRO: ${{ vars.AUTOMEXIA_TEST_WSL_DISTRO }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preserve distro, user, shell, directory, and independent PTY state
        shell: pwsh
        run: cargo xtask test session-clone --native-wsl
      - name: Verify CP3.1 native shell lifecycle in the configured WSL distro
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AUTOMEXIA_TEST_WSL_DISTRO)) {
            throw 'AUTOMEXIA_TEST_WSL_DISTRO is required'
          }
          $workspace = (& wsl.exe -d $env:AUTOMEXIA_TEST_WSL_DISTRO --cd $env:GITHUB_WORKSPACE -- pwd -P).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $workspace.StartsWith('/')) {
            throw 'could not resolve the checked-out workspace inside WSL'
          }
          & wsl.exe -d $env:AUTOMEXIA_TEST_WSL_DISTRO -- bash -lc 'set -euo pipefail; cd -- "$1"; command -v python3 shellcheck zsh fish >/dev/null; bash tools/ci/test_shell_sources.sh' automexia-wsl $workspace
          if ($LASTEXITCODE -ne 0) {
            throw 'CP3.1 WSL shell lifecycle validation failed'
          }

  preflight:
    needs: [native-gui-resilience, native-wsl-resilience]
    if: needs.native-gui-resilience.result == 'success' && needs.native-wsl-resilience.result == 'success'
    runs-on: ubuntu-latest
    environment: stable-release
    env:
      AUTOMEXIA_WINDOWS_SIGNING_BACKEND: ${{ vars.AUTOMEXIA_WINDOWS_SIGNING_BACKEND }}
      AUTOMEXIA_WINDOWS_PUBLISHER_SUBJECT: ${{ vars.AUTOMEXIA_WINDOWS_PUBLISHER_SUBJECT }}
      AUTOMEXIA_WINDOWS_CERTIFICATE: ${{ secrets.AUTOMEXIA_WINDOWS_CERTIFICATE != '' && 'configured' || '' }}
      AUTOMEXIA_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.AUTOMEXIA_WINDOWS_CERTIFICATE_PASSWORD != '' && 'configured' || '' }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID != '' && 'configured' || '' }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID != '' && 'configured' || '' }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID != '' && 'configured' || '' }}
      AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
      AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
      AZURE_ARTIFACT_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' && 'configured' || '' }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' && 'configured' || '' }}
      APPLE_ID: ${{ secrets.APPLE_ID != '' && 'configured' || '' }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD != '' && 'configured' || '' }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' && 'configured' || '' }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' && 'configured' || '' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y glslang-tools libasound2-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-xcb-dev python3-yaml shellcheck zsh
      - name: Protected-main and tag preconditions
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -n "$version"
          test "$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "automexia-terminal") | .version')" = "$version"
          cargo xtask release --version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: windows-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: linux-arm64
    runs-on: ${{ matrix.os }}
    env:
      AUTOMEXIA_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y glslang-tools libasound2-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-xcb-dev
      - run: rustup target add ${{ matrix.target }}
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: cross@0.2.5
        if: runner.os == 'Linux' && matrix.target == 'aarch64-unknown-linux-gnu'
      - name: Build native/cross artifact
        shell: bash
        run: |
          if [[ "${{ runner.os }}-${{ matrix.target }}" == "Linux-aarch64-unknown-linux-gnu" ]]; then
            cross build --release --locked -p automexia-terminal --target "${{ matrix.target }}"
          else
            cargo build --release --locked -p automexia-terminal --target "${{ matrix.target }}"
          fi
      - name: Version smoke
        if: matrix.target == 'x86_64-pc-windows-msvc' || matrix.target == 'x86_64-unknown-linux-gnu' || (runner.os == 'macOS' && runner.arch == 'ARM64' && matrix.target == 'aarch64-apple-darwin')
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/automexia"
          [[ "${{ runner.os }}" == "Windows" ]] && binary="${binary}.exe"
          "$binary" --version
      - name: Stage portable artifact
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.artifact }}"
          binary="target/${{ matrix.target }}/release/automexia"
          [[ "${{ runner.os }}" == "Windows" ]] && binary="${binary}.exe"
          cp "$binary" "dist/${{ matrix.artifact }}/"
          cp LICENSE NOTICE.md THIRD_PARTY_NOTICES.md README.md "dist/${{ matrix.artifact }}/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist
          if-no-files-found: error

  reproducibility-linux:
    name: Reproducible Linux x64 release binary
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y glslang-tools libasound2-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-xcb-dev
      - name: Compare two independent cold release builds
        run: bash tools/ci/check_reproducible_build.sh reproducibility/release-reproducibility-linux-x64.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-reproducibility
          path: reproducibility/release-reproducibility-linux-x64.json
          if-no-files-found: error

  package-windows:
    needs: [preflight, build]
    runs-on: windows-latest
    environment: stable-release
    permissions:
      contents: read
      id-token: write
    env:
      AUTOMEXIA_VERSION: ${{ needs.preflight.outputs.version }}
      AUTOMEXIA_WINDOWS_PUBLISHER_SUBJECT: ${{ vars.AUTOMEXIA_WINDOWS_PUBLISHER_SUBJECT }}
    strategy:
      matrix:
        include:
          - artifact: windows-x86_64
            target: x86_64-pc-windows-msvc
          - artifact: windows-arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: staged
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        if: matrix.target == 'x86_64-pc-windows-msvc'
        with:
          tool: cargo-packager@0.11.8
      - name: Prepare Windows signing inputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force signed | Out-Null
          New-Item -ItemType Directory -Force signing-input | Out-Null
          $binary = Get-ChildItem staged -Recurse -File -Filter automexia.exe
          if (@($binary).Count -ne 1) { throw "expected one staged automexia.exe, found $(@($binary).Count)" }
          Copy-Item -LiteralPath $binary.FullName -Destination signing-input\automexia.exe
      - name: Authenticate to Azure Artifact Signing
        if: vars.AUTOMEXIA_WINDOWS_SIGNING_BACKEND == 'azure-artifact-signing'
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign executable with Azure Artifact Signing
        if: vars.AUTOMEXIA_WINDOWS_SIGNING_BACKEND == 'azure-artifact-signing'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: signing-input
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Automexia Terminal
          description-url: https://github.com/AmjedAllaya/automexia-terminal
      - name: Import fallback PFX
        id: pfx
        if: vars.AUTOMEXIA_WINDOWS_SIGNING_BACKEND == 'pfx'
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.AUTOMEXIA_WINDOWS_CERTIFICATE }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'automexia-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          "path=$pfxPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Sign executable with fallback PFX
        if: vars.AUTOMEXIA_WINDOWS_SIGNING_BACKEND == 'pfx'
        shell: pwsh
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.AUTOMEXIA_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $binary = Get-Item signing-input\automexia.exe
          signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.acs.microsoft.com /d "Automexia Terminal" /du "https://github.com/AmjedAllaya/automexia-terminal" /f "${{ steps.pfx.outputs.path }}" /p $env:CERTIFICATE_PASSWORD $binary.FullName
      - name: Verify publisher and stage signed executable
        shell: pwsh
        run: |
          $binary = Get-Item signing-input\automexia.exe
          signtool verify /pa /all /v /tw $binary.FullName
          $signature = Get-AuthenticodeSignature -LiteralPath $binary.FullName
          if ($signature.Status -ne 'Valid') { throw "executable signature is $($signature.Status)" }
          if ($signature.SignerCertificate.Subject -cne $env:AUTOMEXIA_WINDOWS_PUBLISHER_SUBJECT) {
            throw "unexpected executable publisher: $($signature.SignerCertificate.Subject)"
          }
          if ($null -eq $signature.TimeStamperCertificate) { throw 'executable has no trusted timestamp' }
          $targetDir = "target\${{ matrix.target }}\release"
          New-Item -ItemType Directory -Force $targetDir | Out-Null
          Copy-Item $binary.FullName "$targetDir\automexia.exe"
      - name: Sign PowerShell assets with Azure Artifact Signing
        if: vars.AUTOMEXIA_WINDOWS_SIGNING_BACKEND == 'azure-artifact-signing'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: shell-integration
          files-folder-filter: ps1,ps1xml
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Automexia Terminal shell integration
          description-url: https://github.com/AmjedAllaya/automexia-terminal
      - name: Sign PowerShell assets with fallback PFX
        if: vars.AUTOMEXIA_WINDOWS_SIGNING_BACKEND == 'pfx'
        shell: pwsh
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.AUTOMEXIA_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $flags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            "${{ steps.pfx.outputs.path }}",
            $env:CERTIFICATE_PASSWORD,
            $flags
          )
          try {
            $scripts = @(Get-ChildItem shell-integration -Recurse -File |
              Where-Object Extension -in @('.ps1', '.ps1xml'))
            if ($scripts.Count -eq 0) { throw 'no PowerShell assets were found to sign' }
            foreach ($script in $scripts) {
              $result = Set-AuthenticodeSignature -LiteralPath $script.FullName `
                -Certificate $certificate -HashAlgorithm SHA256 `
                -TimestampServer http://timestamp.digicert.com
              if ($result.Status -ne 'Valid') {
                throw "PowerShell asset signature failed for $($script.FullName): $($result.Status)"
              }
            }
          } finally {
            $certificate.Dispose()
          }
      - name: Verify signed PowerShell assets
        shell: pwsh
        run: |
          $scripts = @(Get-ChildItem shell-integration -Recurse -File |
            Where-Object Extension -in @('.ps1', '.ps1xml'))
          if ($scripts.Count -eq 0) { throw 'no PowerShell assets were found to verify' }
          foreach ($script in $scripts) {
            $signature = Get-AuthenticodeSignature -LiteralPath $script.FullName
            if ($signature.Status -ne 'Valid') {
              throw "PowerShell asset signature is $($signature.Status): $($script.FullName)"
            }
            if ($signature.SignerCertificate.Subject -cne $env:AUTOMEXIA_WINDOWS_PUBLISHER_SUBJECT) {
              throw "unexpected PowerShell asset publisher: $($signature.SignerCertificate.Subject)"
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "PowerShell asset has no trusted timestamp: $($script.FullName)"
            }
          }
      - name: Build MSI and signed portable ZIP
        shell: pwsh
        run: |
          $env:AUTOMEXIA_PACKAGE_SKIP_BUILD = '1'
          cargo xtask package --target ${{ matrix.target }}
          $packageDir = "target\package\${{ matrix.target }}"
          $msi = Get-ChildItem $packageDir -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw 'cargo-packager did not produce an MSI' }
      - name: Sign MSI with Azure Artifact Signing
        if: vars.AUTOMEXIA_WINDOWS_SIGNING_BACKEND == 'azure-artifact-signing'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: target\package\${{ matrix.target }}
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Automexia Terminal
          description-url: https://github.com/AmjedAllaya/automexia-terminal
      - name: Sign MSI with fallback PFX
        if: vars.AUTOMEXIA_WINDOWS_SIGNING_BACKEND == 'pfx'
        shell: pwsh
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.AUTOMEXIA_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $msi = Get-ChildItem "target\package\${{ matrix.target }}" -Filter *.msi | Select-Object -First 1
          signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.acs.microsoft.com /d "Automexia Terminal" /du "https://github.com/AmjedAllaya/automexia-terminal" /f "${{ steps.pfx.outputs.path }}" /p $env:CERTIFICATE_PASSWORD $msi.FullName
      - name: Verify publisher and stage final Windows packages
        shell: pwsh
        run: |
          $packageDir = "target\package\${{ matrix.target }}"
          $msi = Get-ChildItem $packageDir -Filter *.msi | Select-Object -First 1
          signtool verify /pa /all /v /tw $msi.FullName
          $signature = Get-AuthenticodeSignature -LiteralPath $msi.FullName
          if ($signature.Status -ne 'Valid') { throw "MSI signature is $($signature.Status)" }
          if ($signature.SignerCertificate.Subject -cne $env:AUTOMEXIA_WINDOWS_PUBLISHER_SUBJECT) {
            throw "unexpected MSI publisher: $($signature.SignerCertificate.Subject)"
          }
          if ($null -eq $signature.TimeStamperCertificate) { throw 'MSI has no trusted timestamp' }
          Copy-Item $msi.FullName "signed\automexia-terminal-$env:AUTOMEXIA_VERSION-${{ matrix.target }}.msi"
          Copy-Item "$packageDir\automexia-terminal-$env:AUTOMEXIA_VERSION-${{ matrix.target }}.zip" signed
      - name: Remove fallback certificate material
        if: always() && vars.AUTOMEXIA_WINDOWS_SIGNING_BACKEND == 'pfx'
        shell: pwsh
        run: Remove-Item -LiteralPath "${{ steps.pfx.outputs.path }}" -Force -ErrorAction SilentlyContinue
      - name: Clean install, identity, and uninstall smoke
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $previous = $null
          $previousTag = gh release list --exclude-drafts --exclude-pre-releases --limit 20 --json tagName --jq '.[].tagName' |
            Where-Object { $_ -ne $env:GITHUB_REF_NAME } | Select-Object -First 1
          if ($previousTag) {
            New-Item -ItemType Directory -Force previous | Out-Null
            gh release download $previousTag --pattern '*x86_64-pc-windows-msvc.msi' --dir previous
            if ($LASTEXITCODE -eq 0) {
              $previous = (Get-ChildItem previous -Filter *.msi | Select-Object -First 1).FullName
            }
          }
          $arguments = @{
            MsiPath = (Get-ChildItem signed -Filter *.msi | Select-Object -First 1).FullName
            PortableZipPath = (Get-ChildItem signed -Filter *.zip | Select-Object -First 1).FullName
            Version = $env:AUTOMEXIA_VERSION
            ExpectedPublisher = $env:AUTOMEXIA_WINDOWS_PUBLISHER_SUBJECT
          }
          if ($previous) { $arguments.PreviousMsiPath = $previous }
          tools/ci/test_windows_installer.ps1 @arguments
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.artifact }}
          path: |
            signed/*.msi
            signed/*.zip
          if-no-files-found: error

  package-macos:
    needs: [preflight, build]
    runs-on: macos-latest
    environment: stable-release
    env:
      AUTOMEXIA_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-x86_64
          path: staged/x86_64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-arm64
          path: staged/arm64
      - name: Assemble, sign, notarize, and staple universal DMG
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/automexia-signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          certificate="$RUNNER_TEMP/automexia-signing.p12"
          original_keychain=$(security default-keychain -d user | tr -d '"')
          mount=''
          cleanup() {
            if [[ -n "$mount" ]]; then hdiutil detach "$mount" >/dev/null 2>&1 || true; fi
            if [[ -n "$original_keychain" ]]; then security default-keychain -d user -s "$original_keychain" >/dev/null 2>&1 || true; fi
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -f "$certificate"
          }
          trap cleanup EXIT
          x64=$(find staged/x86_64 -type f -name automexia | head -1)
          arm=$(find staged/arm64 -type f -name automexia | head -1)
          app='dist/Automexia Terminal.app'
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create "$x64" "$arm" -output "$app/Contents/MacOS/automexia"
          sed "s/@AUTOMEXIA_VERSION@/$AUTOMEXIA_VERSION/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          cp assets/brand/automexia-terminal.icns "$app/Contents/Resources/automexia-terminal.icns"
          cp LICENSE NOTICE.md THIRD_PARTY_NOTICES.md "$app/Contents/Resources/"
          "$app/Contents/MacOS/automexia" --version | grep -F "$AUTOMEXIA_VERSION"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security default-keychain -s "$keychain"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$app/Contents/MacOS/automexia"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --verbose=4 "$app" 2>&1 | grep -q 'flags=.*runtime'
          entitlements=$(codesign -d --entitlements :- "$app" 2>/dev/null || true)
          if grep -q '<key>com.apple.security.get-task-allow</key>' <<<"$entitlements"; then
            echo 'release app must not contain com.apple.security.get-task-allow' >&2
            exit 1
          fi
          dmg="dist/automexia-terminal-$AUTOMEXIA_VERSION-universal.dmg"
          hdiutil create -volname 'Automexia Terminal' -srcfolder "$app" -ov -format UDZO "$dmg"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --output-format json | tee "$RUNNER_TEMP/automexia-notary-result.json"
          jq -e '.status == "Accepted"' "$RUNNER_TEMP/automexia-notary-result.json"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature -v "$dmg"
          mount=$(hdiutil attach -nobrowse -readonly "$dmg" | sed -n 's#^.*\(/Volumes/.*\)$#\1#p' | tail -1)
          test -x "$mount/Automexia Terminal.app/Contents/MacOS/automexia"
          codesign --verify --deep --strict --verbose=2 "$mount/Automexia Terminal.app"
          spctl --assess --type execute -v "$mount/Automexia Terminal.app"
          hdiutil detach "$mount"
          mount=''
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-macos-universal
          path: dist/automexia-terminal-${{ needs.preflight.outputs.version }}-universal.dmg
          if-no-files-found: error

  package-linux:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    env:
      AUTOMEXIA_VERSION: ${{ needs.preflight.outputs.version }}
    strategy:
      matrix:
        include:
          - artifact: linux-x86_64
            arch: amd64
            target: x86_64-unknown-linux-gnu
          - artifact: linux-arm64
            arch: arm64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: staged
      - name: Install Linux package validators
        run: sudo apt-get update && sudo apt-get install -y appstream cpio desktop-file-utils lintian ncurses-bin rpm scdoc
      - name: Install pinned nFPM
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build DEB, RPM, and portable archive
        run: |
          set -euo pipefail
          binary=$(find staged -type f -name automexia | head -1)
          chmod +x "$binary"
          target_dir="target/${{ matrix.target }}/release"
          mkdir -p "$target_dir"
          cp "$binary" "$target_dir/automexia"
          export AUTOMEXIA_PACKAGE_SKIP_BUILD=1
          cargo xtask package --target "${{ matrix.target }}"
          package_dir="target/package/${{ matrix.target }}"
          desktop-file-validate packaging/linux/automexia-terminal.desktop
          appstreamcli validate --no-net packaging/linux/io.github.AmjedAllaya.AutomexiaTerminal.metainfo.xml
          lintian "$package_dir"/*.deb
          "$binary" --version | grep -F "$AUTOMEXIA_VERSION" || [[ "${{ matrix.arch }}" == "arm64" ]]
      - name: Clean install, metadata, and uninstall smoke
        if: matrix.arch == 'amd64'
        run: bash tools/ci/test_linux_package.sh "target/package/${{ matrix.target }}" "$AUTOMEXIA_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.artifact }}
          path: |
            target/package/${{ matrix.target }}/*.deb
            target/package/${{ matrix.target }}/*.rpm
            target/package/${{ matrix.target }}/*.tar.gz
          if-no-files-found: error

  hardware-smoke:
    name: Controlled GPU, PTY, WSL, signatures, and Defender
    needs: [preflight, package-windows, package-linux]
    runs-on: [self-hosted, windows, x64, automexia-release, gpu, wsl, defender]
    environment: stable-release
    env:
      AUTOMEXIA_VERSION: ${{ needs.preflight.outputs.version }}
      AUTOMEXIA_WINDOWS_PUBLISHER_SUBJECT: ${{ vars.AUTOMEXIA_WINDOWS_PUBLISHER_SUBJECT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-windows-x86_64
          path: trust/windows
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-windows-arm64
          path: trust/windows
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-linux-x86_64
          path: trust/linux
      - name: Verify signed packages and scan with current Defender intelligence
        shell: pwsh
        run: |
          tools/ci/test_release_trust_windows.ps1 `
            -ArtifactDirectory trust/windows `
            -ExpectedPublisher $env:AUTOMEXIA_WINDOWS_PUBLISHER_SUBJECT `
            -Version $env:AUTOMEXIA_VERSION `
            -EvidencePath trust/evidence/release-trust-windows.json
      - name: Native GPU/PTY launch and WSL portable smoke
        shell: pwsh
        run: |
          $windowsArchive = Get-Item "trust/windows/automexia-terminal-$env:AUTOMEXIA_VERSION-x86_64-pc-windows-msvc.zip"
          New-Item -ItemType Directory -Force smoke/windows-final | Out-Null
          Expand-Archive -LiteralPath $windowsArchive.FullName -DestinationPath smoke/windows-final
          $windows = Get-Item smoke/windows-final/automexia.exe
          & $windows.FullName --version
          if ($LASTEXITCODE -ne 0) { throw 'signed Windows portable smoke failed' }
          $process = Start-Process -FilePath $windows.FullName -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($process.HasExited) { throw "Automexia exited during the controlled GPU/PTY smoke" }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              Wait-Process -Id $process.Id -Timeout 30 -ErrorAction SilentlyContinue
            }
          }
          $linuxArchive = Get-Item "trust/linux/automexia-terminal-$env:AUTOMEXIA_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          New-Item -ItemType Directory -Force smoke/linux-final | Out-Null
          tar -xzf $linuxArchive.FullName -C smoke/linux-final
          if ($LASTEXITCODE -ne 0) { throw 'could not extract final Linux portable archive' }
          $linux = Get-Item smoke/linux-final/automexia
          $wslPath = (& wsl.exe wslpath -u $linux.FullName).Trim()
          & wsl.exe chmod +x $wslPath
          if ($LASTEXITCODE -ne 0) { throw 'WSL could not prepare the Linux artifact' }
          & wsl.exe $wslPath --version
          if ($LASTEXITCODE -ne 0) { throw 'WSL portable smoke failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-windows
          path: trust/evidence/release-trust-windows.json
          if-no-files-found: error

  publish:
    needs: [preflight, reproducibility-linux, package-windows, package-macos, package-linux, hardware-smoke]
    runs-on: ubuntu-latest
    environment: stable-release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-evidence-windows
          path: release-evidence
      - name: Require immutable GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq '.enabled')" = "true"
      - name: Enforce final package allowlist and measure hashing overhead
        run: |
          mkdir release-assets
          mkdir -p sbom-input/packages
          python tools/ci/release_trust.py \
            --artifacts packages \
            --version "${{ needs.preflight.outputs.version }}" \
            --manifest release-assets/release-manifest.json \
            --benchmark release-assets/release-trust-benchmark.json
          cp packages/* release-assets/
          cp packages/* sbom-input/packages/
          cp Cargo.lock sbom-input/Cargo.lock
          cp release-evidence/release-trust-windows.json release-assets/
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: sbom-input
          format: spdx-json
          output-file: release-assets/automexia-terminal.spdx.json
          upload-artifact: false
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: sbom-input
          format: cyclonedx-json
          output-file: release-assets/automexia-terminal.cdx.json
          upload-artifact: false
      - name: Generate complete checksums
        run: |
          (cd release-assets && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS)
          python tools/ci/release_trust.py \
            --verify-final release-assets \
            --version "${{ needs.preflight.outputs.version }}" \
            --expected-windows-publisher "${{ vars.AUTOMEXIA_WINDOWS_PUBLISHER_SUBJECT }}"
      - name: Attest final package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/*.msi
            release-assets/*.zip
            release-assets/*.dmg
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/*.tar.gz
          create-storage-record: false
      - name: Attest final package SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/*.msi
            release-assets/*.zip
            release-assets/*.dmg
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/*.tar.gz
          sbom-path: release-assets/automexia-terminal.spdx.json
          create-storage-record: false
      - name: Publish protected-tag assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Refusing to modify an existing release: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes --title "Automexia Terminal ${{ needs.preflight.outputs.version }}"
          find release-assets -maxdepth 1 -type f -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
