name: Stable release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: stable-release
    env:
      AUTOMEXIA_WINDOWS_CERTIFICATE: ${{ secrets.AUTOMEXIA_WINDOWS_CERTIFICATE }}
      AUTOMEXIA_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.AUTOMEXIA_WINDOWS_CERTIFICATE_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-xcb-dev
      - name: Protected-main and tag preconditions
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -n "$version"
          test "$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "automexia-terminal") | .version')" = "$version"
          cargo xtask release --version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    environment: stable-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: windows-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: linux-arm64
    runs-on: ${{ matrix.os }}
    env:
      AUTOMEXIA_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-xcb-dev
      - run: rustup target add ${{ matrix.target }}
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: cross@0.2.5
        if: runner.os == 'Linux' && matrix.target == 'aarch64-unknown-linux-gnu'
      - name: Build native/cross artifact
        shell: bash
        run: |
          if [[ "${{ runner.os }}-${{ matrix.target }}" == "Linux-aarch64-unknown-linux-gnu" ]]; then
            cross build --release --locked -p automexia-terminal --target "${{ matrix.target }}"
          else
            cargo build --release --locked -p automexia-terminal --target "${{ matrix.target }}"
          fi
      - name: Version smoke
        if: matrix.target == 'x86_64-pc-windows-msvc' || matrix.target == 'x86_64-unknown-linux-gnu' || (runner.os == 'macOS' && runner.arch == 'ARM64' && matrix.target == 'aarch64-apple-darwin')
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/automexia"
          [[ "${{ runner.os }}" == "Windows" ]] && binary="${binary}.exe"
          "$binary" --version
      - name: Stage portable artifact
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.artifact }}"
          binary="target/${{ matrix.target }}/release/automexia"
          [[ "${{ runner.os }}" == "Windows" ]] && binary="${binary}.exe"
          cp "$binary" "dist/${{ matrix.artifact }}/"
          cp LICENSE NOTICE.md THIRD_PARTY_NOTICES.md README.md "dist/${{ matrix.artifact }}/"
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist/${{ matrix.artifact }}
          format: spdx-json
          output-file: dist/${{ matrix.artifact }}.spdx.json
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist/${{ matrix.artifact }}
          format: cyclonedx-json
          output-file: dist/${{ matrix.artifact }}.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist
          if-no-files-found: error

  package-windows:
    needs: [preflight, build]
    runs-on: windows-latest
    environment: stable-release
    env:
      AUTOMEXIA_VERSION: ${{ needs.preflight.outputs.version }}
    strategy:
      matrix:
        include:
          - artifact: windows-x86_64
            target: x86_64-pc-windows-msvc
          - artifact: windows-arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: staged
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: cargo-packager@0.11.8
      - name: Import certificate and sign executable
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.AUTOMEXIA_WINDOWS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.AUTOMEXIA_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force signed | Out-Null
          [IO.File]::WriteAllBytes('signed\automexia.pfx', [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $binary = Get-ChildItem staged -Recurse -Filter automexia.exe | Select-Object -First 1
          signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f signed\automexia.pfx /p $env:CERTIFICATE_PASSWORD $binary.FullName
          signtool verify /pa $binary.FullName
          Copy-Item $binary.FullName signed\automexia.exe
          $targetDir = "target\${{ matrix.target }}\release"
          New-Item -ItemType Directory -Force $targetDir | Out-Null
          Copy-Item $binary.FullName "$targetDir\automexia.exe"
      - name: Build and sign MSI
        shell: pwsh
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.AUTOMEXIA_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $env:AUTOMEXIA_PACKAGE_SKIP_BUILD = '1'
          cargo xtask package --target ${{ matrix.target }}
          $packageDir = "target\package\${{ matrix.target }}"
          $msi = Get-ChildItem $packageDir -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw 'cargo-packager did not produce an MSI' }
          signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f signed\automexia.pfx /p $env:CERTIFICATE_PASSWORD $msi.FullName
          signtool verify /pa $msi.FullName
          Copy-Item $msi.FullName "signed\automexia-$env:AUTOMEXIA_VERSION-${{ matrix.target }}.msi"
          Copy-Item "$packageDir\automexia-terminal-$env:AUTOMEXIA_VERSION-${{ matrix.target }}.zip" signed
          Remove-Item signed\automexia.pfx -Force
      - name: Clean install, identity, and uninstall smoke
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: tools/ci/test_windows_installer.ps1 -MsiPath (Get-ChildItem signed -Filter *.msi | Select-Object -First 1).FullName -Version $env:AUTOMEXIA_VERSION
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.artifact }}
          path: signed/*
          if-no-files-found: error

  package-macos:
    needs: [preflight, build]
    runs-on: macos-latest
    environment: stable-release
    env:
      AUTOMEXIA_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-x86_64
          path: staged/x86_64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-arm64
          path: staged/arm64
      - name: Assemble, sign, notarize, and staple universal DMG
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          x64=$(find staged/x86_64 -type f -name automexia | head -1)
          arm=$(find staged/arm64 -type f -name automexia | head -1)
          app='dist/Automexia Terminal.app'
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create "$x64" "$arm" -output "$app/Contents/MacOS/automexia"
          sed "s/@AUTOMEXIA_VERSION@/$AUTOMEXIA_VERSION/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          cp assets/brand/automexia-terminal.icns "$app/Contents/Resources/automexia-terminal.icns"
          cp LICENSE NOTICE.md THIRD_PARTY_NOTICES.md "$app/Contents/Resources/"
          "$app/Contents/MacOS/automexia" --version | grep -F "$AUTOMEXIA_VERSION"
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p temporary automexia.keychain
          security import certificate.p12 -k automexia.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k temporary automexia.keychain
          security default-keychain -s automexia.keychain
          codesign --force --options runtime --timestamp --deep --sign "$APPLE_SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          dmg="dist/automexia-terminal-$AUTOMEXIA_VERSION-universal.dmg"
          hdiutil create -volname 'Automexia Terminal' -srcfolder "$app" -ov -format UDZO "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature -v "$dmg"
          mount=$(hdiutil attach -nobrowse -readonly "$dmg" | sed -n 's#^.*\(/Volumes/.*\)$#\1#p' | tail -1)
          test -x "$mount/Automexia Terminal.app/Contents/MacOS/automexia"
          hdiutil detach "$mount"
          security delete-keychain automexia.keychain
          rm -f certificate.p12
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-macos-universal
          path: dist/automexia-terminal-${{ needs.preflight.outputs.version }}-universal.dmg
          if-no-files-found: error

  package-linux:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    env:
      AUTOMEXIA_VERSION: ${{ needs.preflight.outputs.version }}
    strategy:
      matrix:
        include:
          - artifact: linux-x86_64
            arch: amd64
            target: x86_64-unknown-linux-gnu
          - artifact: linux-arm64
            arch: arm64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: staged
      - name: Install Linux package validators
        run: sudo apt-get update && sudo apt-get install -y appstream cpio desktop-file-utils lintian ncurses-bin rpm scdoc
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: nfpm@v2.43.4
      - name: Build DEB, RPM, and portable archive
        run: |
          set -euo pipefail
          binary=$(find staged -type f -name automexia | head -1)
          chmod +x "$binary"
          target_dir="target/${{ matrix.target }}/release"
          mkdir -p "$target_dir"
          cp "$binary" "$target_dir/automexia"
          export AUTOMEXIA_PACKAGE_SKIP_BUILD=1
          cargo xtask package --target "${{ matrix.target }}"
          package_dir="target/package/${{ matrix.target }}"
          desktop-file-validate packaging/linux/automexia-terminal.desktop
          appstreamcli validate --no-net packaging/linux/io.github.AmjedAllaya.AutomexiaTerminal.metainfo.xml
          lintian "$package_dir"/*.deb
          "$binary" --version | grep -F "$AUTOMEXIA_VERSION" || [[ "${{ matrix.arch }}" == "arm64" ]]
      - name: Clean install, metadata, and uninstall smoke
        if: matrix.arch == 'amd64'
        run: bash tools/ci/test_linux_package.sh "target/package/${{ matrix.target }}" "$AUTOMEXIA_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.artifact }}
          path: target/package/${{ matrix.target }}/*
          if-no-files-found: error

  hardware-smoke:
    name: Controlled GPU, PTY, and WSL smoke
    needs: [preflight, build]
    runs-on: [self-hosted, windows, x64, automexia-release, gpu, wsl]
    environment: stable-release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-x86_64
          path: smoke/windows
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-x86_64
          path: smoke/linux
      - name: Native GPU/PTY launch and WSL portable smoke
        shell: pwsh
        run: |
          $windows = Get-ChildItem smoke/windows -Recurse -Filter automexia.exe | Select-Object -First 1
          & $windows.FullName --version
          $process = Start-Process -FilePath $windows.FullName -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "Automexia exited during the controlled GPU/PTY smoke" }
          Stop-Process -Id $process.Id
          $linux = Get-ChildItem smoke/linux -Recurse -Filter automexia | Select-Object -First 1
          $wslPath = (& wsl.exe wslpath -u $linux.FullName).Trim()
          & wsl.exe chmod +x $wslPath
          if ($LASTEXITCODE -ne 0) { throw 'WSL could not prepare the Linux artifact' }
          & wsl.exe $wslPath --version
          if ($LASTEXITCODE -ne 0) { throw 'WSL portable smoke failed' }

  publish:
    needs: [preflight, build, package-windows, package-macos, package-linux, hardware-smoke]
    runs-on: ubuntu-latest
    environment: stable-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          find dist -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          mv SHA256SUMS dist/SHA256SUMS
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: 'dist/**/*'
      - name: Publish protected-tag assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes --title "Automexia Terminal ${{ needs.preflight.outputs.version }}"
          find dist -type f -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
