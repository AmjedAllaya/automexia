name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 4'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: rust
          build-mode: none
      - name: Analyze Rust without requiring private-repository code-scanning entitlement
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          output: codeql-results
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
      - name: Retain private-repository SARIF for maintainer review
        if: ${{ always() && github.event.repository.private }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-rust-sarif-${{ github.run_id }}
          path: codeql-results/**/*.sarif
          if-no-files-found: error
          retention-days: 14
