name: Nightly depth

on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [vt_parser, osc_metadata, config_migration, semantic_classification, label_sanitization]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: cargo-fuzz@0.13.1
      - run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=120

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install nightly --profile minimal --component miri
      - run: cargo +nightly miri test -p rio-vt --lib --no-default-features

  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install nightly --profile minimal
      - env:
          RUSTFLAGS: -Zsanitizer=${{ matrix.sanitizer }}
          RUSTDOCFLAGS: -Zsanitizer=${{ matrix.sanitizer }}
        run: cargo +nightly test -p rio-vt --lib --no-default-features -Zbuild-std --target x86_64-unknown-linux-gnu

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo bench -p rio-vt -p corcovado --no-run --locked

  unsigned-windows:
    name: Unsigned Windows ${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup target add ${{ matrix.target }}
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: cargo-packager@0.11.8
      - run: cargo build --release --locked -p automexia-terminal --target ${{ matrix.target }}
      - name: Build unsigned MSI and portable ZIP
        shell: pwsh
        run: |
          cargo packager --manifest-path apps/automexia-terminal/Cargo.toml --release --out-dir target/package --target ${{ matrix.target }} --formats wix
          New-Item -ItemType Directory -Force target/package/portable | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/automexia.exe",LICENSE,NOTICE.md,README.md target/package/portable
          Compress-Archive -Path target/package/portable/* -DestinationPath "target/package/automexia-nightly-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: automexia-nightly-${{ matrix.target }}
          path: |
            target/package/*.msi
            target/package/*.zip
          if-no-files-found: error
          retention-days: 7

  unsigned-linux:
    name: Unsigned Linux ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y appstream desktop-file-utils libasound2-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-xcb-dev ncurses-bin rpm scdoc
      - run: rustup target add ${{ matrix.target }}
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: cross@0.2.5,nfpm@v2.43.4
      - name: Build release binary
        run: |
          if [[ "${{ matrix.target }}" == aarch64-* ]]; then
            cross build --release --locked -p automexia-terminal --target "${{ matrix.target }}"
          else
            cargo build --release --locked -p automexia-terminal --target "${{ matrix.target }}"
          fi
      - name: Build unsigned DEB, RPM, and portable archive
        run: |
          mkdir -p target/package/terminfo
          scdoc < packaging/linux/automexia.1.scd > target/package/automexia.1
          tic -x -o target/package/terminfo packaging/linux/automexia.terminfo
          export NFPM_ARCH=${{ matrix.arch }} AUTOMEXIA_VERSION=0.4.0
          export AUTOMEXIA_BINARY=target/${{ matrix.target }}/release/automexia
          export AUTOMEXIA_MANPAGE=target/package/automexia.1 AUTOMEXIA_TERMINFO_ROOT=target/package/terminfo
          nfpm package --config packaging/linux/nfpm.yaml --packager deb --target target/package/
          nfpm package --config packaging/linux/nfpm.yaml --packager rpm --target target/package/
          tar -czf "target/package/automexia-nightly-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" automexia -C "$GITHUB_WORKSPACE" LICENSE NOTICE.md README.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: automexia-nightly-${{ matrix.target }}
          path: |
            target/package/*.deb
            target/package/*.rpm
            target/package/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  unsigned-macos:
    name: Unsigned macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: cargo-packager@0.11.8
      - run: |
          cargo build --release --locked -p automexia-terminal --target x86_64-apple-darwin
          cargo build --release --locked -p automexia-terminal --target aarch64-apple-darwin
          mkdir -p target/release
          lipo -create target/x86_64-apple-darwin/release/automexia target/aarch64-apple-darwin/release/automexia -output target/release/automexia
          cargo packager --manifest-path apps/automexia-terminal/Cargo.toml --release --out-dir target/package --formats app,dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: automexia-nightly-macos-universal
          path: |
            target/package/*.app
            target/package/*.dmg
          if-no-files-found: error
          retention-days: 7
