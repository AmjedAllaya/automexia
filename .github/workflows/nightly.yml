name: Nightly depth

on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  native-gui-resize-stress:
    name: Native Windows GUI resize and history latency
    if: vars.AUTOMEXIA_NATIVE_GUI_RUNNER == '1'
    runs-on: [self-hosted, Windows, X64, automexia-gpu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Exercise history, clones, real window, ConPTY, and renderer snapshots
        shell: pwsh
        run: cargo xtask test session-clone --native-windows

  native-windows-deep:
    name: Windows AppVerifier, WPR, and resource lifetime
    if: vars.AUTOMEXIA_WINDOWS_DEEP_RUNNER == '1'
    runs-on: [self-hosted, Windows, X64, automexia-gpu, automexia-elevated]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Application Verifier Basics and native lifecycle stress
        shell: pwsh
        run: tests/integration/appverifier-windows.ps1 -OutputDirectory target/native-deep/appverifier
      - name: WPR resource trace and bounded manifest
        shell: pwsh
        run: tests/integration/wpr-windows.ps1 -OutputDirectory target/native-deep/wpr -DeleteTraceAfterManifest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: automexia-windows-deep-evidence
          path: |
            target/native-deep/**/*.json
            target/native-deep/**/*.xml
          if-no-files-found: error
          retention-days: 7

  native-wsl-session-clone:
    name: Native WSL session clone
    if: vars.AUTOMEXIA_WSL_RUNNER == '1'
    runs-on: [self-hosted, Windows, X64, automexia-wsl]
    env:
      AUTOMEXIA_TEST_WSL_DISTRO: ${{ vars.AUTOMEXIA_TEST_WSL_DISTRO }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Clone the configured WSL distro without a PowerShell fallback
        shell: pwsh
        run: cargo xtask test session-clone --native-wsl

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [vt_parser, osc_metadata, control_string_bounds, image_decoder, openssh_inventory, config_migration, semantic_classification, label_sanitization]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the nightly compiler required by libFuzzer
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cargo-fuzz@0.13.1
      - name: Fuzz ${{ matrix.target }} with nightly
        run: cargo +nightly fuzz run ${{ matrix.target }} --target x86_64-unknown-linux-gnu -- -max_total_time=120 -rss_limit_mb=768 -timeout=15

  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # rio-vt intentionally tests bounded temporary-file image transports.
      # Miri still checks UB; the ephemeral runner supplies the filesystem sandbox.
      MIRIFLAGS: -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly --profile minimal --component miri
      - name: Bounded pure VT memory-safety suite
        run: |
          cargo +nightly miri test -p rio-vt --lib --no-default-features --locked simd_utf8::tests
          cargo +nightly miri test -p rio-vt --lib --no-default-features --locked simd_base64::tests
          cargo +nightly miri test -p rio-vt --lib --no-default-features --locked performer::parser::tests
          cargo +nightly miri test -p rio-vt --lib --no-default-features --locked ansi::kitty_graphics_protocol::tests::test_file_transmission_medium
          cargo +nightly miri test -p rio-vt --lib --no-default-features --locked ansi::kitty_graphics_protocol::tests::test_temp_file_transmission_medium
      - name: Pure Phase 1 contracts, UI policy, and lifecycle state
        run: |
          cargo +nightly miri test -p automexia-extension-api -p automexia-ui-model --lib
          cargo +nightly miri test -p automexia-extension-runtime --lib rebind

  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly --profile minimal --component rust-src
      - env:
          RUSTFLAGS: -Zsanitizer=${{ matrix.sanitizer }}
          RUSTDOCFLAGS: -Zsanitizer=${{ matrix.sanitizer }}
        run: |
          cargo +nightly test -p rio-vt --lib --no-default-features -Zbuild-std --target x86_64-unknown-linux-gnu
          cargo +nightly test -p automexia-image --lib -Zbuild-std --target x86_64-unknown-linux-gnu
          cargo +nightly test -p automexia-extension-runtime --lib --locked -Zbuild-std --target x86_64-unknown-linux-gnu -- --skip loom_models

  benchmark-build:
    name: Benchmark targets compile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install benchmark build dependencies
        run: sudo apt-get update && sudo apt-get install -y glslang-tools libasound2-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-xcb-dev
      - run: cargo bench -p automexia-terminal -p rio-vt -p corcovado -p teletypewriter -p automexia-devops -p automexia-devops-ssh --no-run --locked

  benchmarks-controlled:
    name: Execute benchmarks on named controlled hardware
    if: vars.AUTOMEXIA_BENCHMARK_RUNNER == '1'
    runs-on: [self-hosted, Linux, X64, automexia-benchmark]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cargo-nextest@0.9.137,cargo-deny@0.20.2
      - name: Execute and retain Criterion measurements
        env:
          AUTOMEXIA_QA_BENCHMARKS: '1'
        run: cargo xtask qa --full --bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: automexia-controlled-benchmark-evidence
          path: |
            target/criterion/**
            target/qa/*.zip
          if-no-files-found: error
          retention-days: 30

  unsigned-windows:
    name: Unsigned Windows ${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup target add ${{ matrix.target }}
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        if: matrix.target == 'x86_64-pc-windows-msvc'
        with:
          tool: cargo-packager@0.11.8
      - run: cargo build --release --locked -p automexia-terminal --target ${{ matrix.target }}
      - name: Build unsigned MSI and portable ZIP
        shell: pwsh
        run: |
          $env:AUTOMEXIA_PACKAGE_SKIP_BUILD = '1'
          cargo xtask package --target ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: automexia-nightly-${{ matrix.target }}
          path: |
            target/package/${{ matrix.target }}/*.msi
            target/package/${{ matrix.target }}/*.zip
          if-no-files-found: error
          retention-days: 7

  unsigned-linux:
    name: Unsigned Linux ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y appstream desktop-file-utils glslang-tools libasound2-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-xcb-dev ncurses-bin rpm scdoc
      - run: rustup target add ${{ matrix.target }}
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cross@0.2.5
      - name: Install pinned nFPM
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build release binary
        run: |
          if [[ "${{ matrix.target }}" == aarch64-* ]]; then
            cross build --release --locked -p automexia-terminal --target "${{ matrix.target }}"
          else
            cargo build --release --locked -p automexia-terminal --target "${{ matrix.target }}"
          fi
      - name: Build unsigned DEB, RPM, and portable archive
        run: |
          export AUTOMEXIA_PACKAGE_SKIP_BUILD=1
          cargo xtask package --target "${{ matrix.target }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: automexia-nightly-${{ matrix.target }}
          path: |
            target/package/${{ matrix.target }}/*.deb
            target/package/${{ matrix.target }}/*.rpm
            target/package/${{ matrix.target }}/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  unsigned-macos:
    name: Unsigned macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cargo-packager@0.11.8
      - run: |
          cargo build --release --locked -p automexia-terminal --target x86_64-apple-darwin
          cargo build --release --locked -p automexia-terminal --target aarch64-apple-darwin
          mkdir -p target/release
          lipo -create target/x86_64-apple-darwin/release/automexia target/aarch64-apple-darwin/release/automexia -output target/release/automexia
          cargo packager --manifest-path apps/automexia-terminal/Cargo.toml --release --no-build --out-dir target/package --formats app,dmg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: automexia-nightly-macos-universal
          path: |
            target/package/*.app
            target/package/*.dmg
          if-no-files-found: error
          retention-days: 7
