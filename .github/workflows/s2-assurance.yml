name: S2 controlled activation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s2-controlled-activation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate-active-baseline:
    name: Validate independently reviewed active S2 baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Verify policy, mutations, source identity, and active baseline
      run: "set -euo pipefail\npython tools/ci/performance_assurance.py check-policy\n\
        python tools/ci/test_performance_assurance.py\nmkdir -p target/performance\n\
        python tools/ci/performance_assurance.py validate-baseline \\\n  --expected-source-commit
        \"$GITHUB_SHA\" \\\n  --output target/performance/s2-activation-summary.json\n"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: automexia-s2-activation-summary
        path: target/performance/s2-activation-summary.json
        if-no-files-found: error
        retention-days: 90
