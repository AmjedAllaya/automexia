name: Linux Early Access release
run-name: "Linux Early Access · ${{ github.event_name }} · ${{ github.event.pull_request.head.ref || github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer package version to rehearse without signing or publishing
        required: true
        type: string
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  pull-requests: read

env:
  AUTOMEXIA_RUST_TOOLCHAIN: 1.98.0
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  PUBLIC_REPOSITORY: AmjedAllaya/automexia-releases

jobs:
  authorize:
    name: Authorize Linux release or rehearsal
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main' &&
       startsWith(github.event.pull_request.head.ref, 'release/linux/') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.authorize.outputs.commit }}
      publish: ${{ steps.authorize.outputs.publish }}
      version: ${{ steps.authorize.outputs.version }}
    steps:
      - name: Check out the exact merged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.merge_commit_sha }}
      - name: Validate rehearsal or owner-authorized release
        id: authorize
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          EVENT_COMMIT: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.merge_commit_sha }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EVENT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            [[ "$DISPATCH_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo 'A rehearsal version must be exact SemVer X.Y.Z.' >&2
              exit 1
            }
            version="$DISPATCH_VERSION"
            publish=false
          else
            current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
            version="$(python3 tools/ci/public_distribution.py authorize-release \
              --event "$GITHUB_EVENT_PATH" --event-name "$EVENT_NAME" \
              --repository "$GITHUB_REPOSITORY" --actor "$GITHUB_ACTOR" \
              --triggering-actor "$GITHUB_TRIGGERING_ACTOR" \
              --commit "$EVENT_COMMIT" --current-main "$current_main")"
            publish=true
          fi
          grep -Fq "version = \"$version\"" Cargo.toml || { echo 'Cargo workspace version does not match the release branch.' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$EVENT_COMMIT"
          python3 tools/ci/public_distribution.py check-policy
          python3 tools/ci/test_public_distribution.py
          python3 .github/scripts/check_action_pins.py
          python3 .github/scripts/check_free_plan_contract.py
          {
            echo "commit=$EVENT_COMMIT"
            echo "publish=$publish"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  quality:
    name: Linux release quality gate
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # GitHub Free runners provide a small CPU/memory/disk envelope. Keep
      # linker concurrency and debug artifacts bounded across the full graph.
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      NEXTEST_TEST_THREADS: '1'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: automexia-rust-1.98-v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.commit }}
      - name: Install pinned Rust and native dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$AUTOMEXIA_RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$AUTOMEXIA_RUST_TOOLCHAIN"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslang-tools libasound2-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-xcb-dev shellcheck zsh fish
      - name: Cache Cargo registry and Git sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-sources-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-sources-v1-${{ runner.os }}-
      - name: Install checksum-verified compiler cache
        id: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Install pinned quality tools
        uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8
        with:
          tool: cargo-nextest@0.9.137,cargo-audit@0.22.0,cargo-deny@0.20.2
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Warning-denied all-target Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Reclaim release lint artifacts before the all-feature test build
        run: cargo clean
      - name: Workspace unit and integration tests
        run: cargo nextest run --workspace --all-features --locked --profile ci
      - name: Workspace documentation tests
        run: cargo test --workspace --all-features --doc --locked
      - name: RustSec dependency audit
        run: cargo audit --deny warnings
      - name: Dependency, license, and source policy
        run: cargo deny --locked --color never check --hide-inclusion-graph
      - name: Shell integration syntax and contract smoke
        run: bash tools/ci/test_shell_sources.sh
      - name: Report compiler cache statistics
        if: ${{ always() && steps.sccache.outcome == 'success' }}
        run: sccache --show-stats

  package:
    name: Native Linux package build
    needs: authorize
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            runner_arch: X64
            nfpm_arch: x86_64
            nfpm_sha256: cafb544650cb0305d1b164fc0ab261eb77a81af324e18011282d326b326d20fb
            target: x86_64-unknown-linux-gnu
            artifact: public-linux-x64
          - runner: ubuntu-22.04-arm
            runner_arch: ARM64
            nfpm_arch: arm64
            nfpm_sha256: e4365707dedfda6e089f597dcdab9497beea80accb2c2704be18981e4a4d9b9b
            target: aarch64-unknown-linux-gnu
            artifact: public-linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    env:
      AUTOMEXIA_VERSION: ${{ needs.authorize.outputs.version }}
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      NFPM_VERSION: '2.43.4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.commit }}
      - name: Cache Cargo registry and Git sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-sources-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-sources-v1-${{ runner.os }}-
      - name: Require native architecture and install packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ARCH" = "${{ matrix.runner_arch }}"
          rustup toolchain install "$AUTOMEXIA_RUST_TOOLCHAIN" --profile minimal
          rustup default "$AUTOMEXIA_RUST_TOOLCHAIN"
          rustup target add "${{ matrix.target }}"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream cpio desktop-file-utils glslang-tools libasound2-dev libfontconfig1-dev libwayland-dev libx11-xcb-dev libxkbcommon-dev lintian ncurses-bin rpm scdoc
          nfpm_archive="nfpm_${NFPM_VERSION}_Linux_${{ matrix.nfpm_arch }}.tar.gz"
          nfpm_path="$RUNNER_TEMP/$nfpm_archive"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            --output "$nfpm_path" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/$nfpm_archive"
          printf '%s  %s\n' "${{ matrix.nfpm_sha256 }}" "$nfpm_path" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/nfpm-bin"
          tar --extract --gzip --file "$nfpm_path" --directory "$RUNNER_TEMP/nfpm-bin" nfpm
          "$RUNNER_TEMP/nfpm-bin/nfpm" --version | grep -F "$NFPM_VERSION"
          echo "$RUNNER_TEMP/nfpm-bin" >> "$GITHUB_PATH"
      - name: Build, package, and exercise install lifecycle
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p automexia-terminal --target "${{ matrix.target }}"
          binary="target/${{ matrix.target }}/release/automexia"
          "$binary" --version | grep -F "$AUTOMEXIA_VERSION"
          export AUTOMEXIA_PACKAGE_SKIP_BUILD=1
          cargo xtask package --target "${{ matrix.target }}"
          package_dir="target/package/${{ matrix.target }}"
          desktop-file-validate packaging/linux/automexia-terminal.desktop
          appstreamcli validate --no-net packaging/linux/io.github.AmjedAllaya.AutomexiaTerminal.metainfo.xml
          lintian "$package_dir"/*.deb
          bash tools/ci/test_linux_package.sh "$package_dir" "$AUTOMEXIA_VERSION"
          mkdir -p public-packages
          cp "$package_dir"/*.deb "$package_dir"/*.rpm "$package_dir"/*.tar.gz public-packages/
      - name: Upload exact native package set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact }}
          path: public-packages
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  rehearsal:
    name: Retain credential-free native rehearsal
    needs: [authorize, quality, package]
    if: needs.authorize.outputs.publish == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: public-linux-*
          path: package-source
          merge-multiple: true
      - name: Prove the exact unsigned rehearsal package contract
        shell: bash
        env:
          REHEARSAL_COMMIT: ${{ needs.authorize.outputs.commit }}
          REHEARSAL_VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          set -euo pipefail
          python3 tools/ci/public_distribution.py build \
            --source package-source \
            --output rehearsal-bundle \
            --version "$REHEARSAL_VERSION" \
            --commit "$REHEARSAL_COMMIT" \
            --copy-packages
          test "$(find rehearsal-bundle -maxdepth 1 -type f | wc -l)" -eq 7
          printf '%s\n' \
            'REHEARSAL-NOT-A-PUBLIC-RELEASE' \
            'Unsigned package rehearsal. Do not distribute or activate.' \
            > rehearsal-bundle/REHEARSAL-NOT-A-PUBLIC-RELEASE.txt
      - name: Retain bounded private rehearsal evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-package-rehearsal-${{ needs.authorize.outputs.version }}
          path: rehearsal-bundle
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  assemble:
    name: Assemble and sign public Linux bundle
    needs: [authorize, quality, package]
    if: needs.authorize.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: public-linux-*
          path: package-source
          merge-multiple: true
      - name: Build exact package manifest and public evidence
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.authorize.outputs.commit }}
          RELEASE_MINISIGN_PUBLIC_KEY: ${{ vars.AUTOMEXIA_RELEASE_MINISIGN_PUBLIC_KEY }}
          RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_MINISIGN_PUBLIC_KEY" =~ ^RW[A-Za-z0-9+/=]+$ ]] || { echo 'The minisign public key is missing or invalid.' >&2; exit 1; }
          python3 tools/ci/public_distribution.py build \
            --source package-source \
            --output release-bundle \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT" \
            --copy-packages
          cp docs/public-release/INSTALL.md release-bundle/INSTALL.md
          cp docs/public-release/UNINSTALL.md release-bundle/UNINSTALL.md
          cp docs/public-release/RELEASE-NOTES.md release-bundle/RELEASE-NOTES.md
          cp THIRD_PARTY_NOTICES.md release-bundle/THIRD_PARTY_NOTICES.md
          printf 'untrusted comment: Automexia release verification key\n%s\n' "$RELEASE_MINISIGN_PUBLIC_KEY" > release-bundle/automexia-release-key.pub
          mkdir -p sbom-input/packages
          cp release-bundle/*.deb release-bundle/*.rpm release-bundle/*.tar.gz sbom-input/packages/
          cp Cargo.lock sbom-input/Cargo.lock
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
        with:
          path: sbom-input
          format: spdx-json
          output-file: release-bundle/automexia-terminal.spdx.json
          upload-artifact: false
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
        with:
          path: sbom-input
          format: cyclonedx-json
          output-file: release-bundle/automexia-terminal.cdx.json
          upload-artifact: false
      - name: Create and verify the detached checksum signature
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.authorize.outputs.commit }}
          RELEASE_MINISIGN_PUBLIC_KEY: ${{ vars.AUTOMEXIA_RELEASE_MINISIGN_PUBLIC_KEY }}
          RELEASE_MINISIGN_SECRET_KEY: ${{ secrets.AUTOMEXIA_RELEASE_MINISIGN_SECRET_KEY }}
          RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          (
            cd release-bundle
            mapfile -t files < <(find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name SHA256SUMS.minisig -printf '%f\n' | LC_ALL=C sort)
            for file in "${files[@]}"; do sha256sum -- "$file"; done > SHA256SUMS
          )
          key="$RUNNER_TEMP/automexia-release.minisign.key"
          cleanup() { rm -f "$key"; }
          trap cleanup EXIT
          umask 077
          printf '%s' "$RELEASE_MINISIGN_SECRET_KEY" | base64 --decode > "$key"
          test -s "$key"
          minisign -S -W -s "$key" -m release-bundle/SHA256SUMS -x release-bundle/SHA256SUMS.minisig -t "Automexia Linux Early Access v$RELEASE_VERSION source $RELEASE_COMMIT"
          minisign -V -P "$RELEASE_MINISIGN_PUBLIC_KEY" -m release-bundle/SHA256SUMS -x release-bundle/SHA256SUMS.minisig
          python3 tools/ci/public_distribution.py verify-bundle --directory release-bundle
      - name: Upload signed create-once bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-linux-release-bundle
          path: release-bundle
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish immutable public Linux prerelease
    needs: [authorize, assemble]
    if: needs.authorize.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: linux-early-access-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: public-linux-release-bundle
          path: release-bundle
      - name: Reverify exact bundle and signature before obtaining write authority
        shell: bash
        env:
          RELEASE_MINISIGN_PUBLIC_KEY: ${{ vars.AUTOMEXIA_RELEASE_MINISIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          python3 tools/ci/public_distribution.py verify-bundle --directory release-bundle
          minisign -V -P "$RELEASE_MINISIGN_PUBLIC_KEY" -m release-bundle/SHA256SUMS -x release-bundle/SHA256SUMS.minisig
          gh release verify --help >/dev/null
          gh release verify-asset --help >/dev/null
      - name: Create repository-scoped one-hour GitHub App token
        id: distribution-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.AUTOMEXIA_DISTRIBUTION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMEXIA_DISTRIBUTION_APP_PRIVATE_KEY }}
          owner: AmjedAllaya
          repositories: automexia-releases
          permission-administration: read
          permission-contents: write
      - name: Publish once, verify the draft, then verify immutable state
        shell: bash
        env:
          GH_TOKEN: ${{ steps.distribution-token.outputs.token }}
          RELEASE_COMMIT: ${{ needs.authorize.outputs.commit }}
          VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          api_header='X-GitHub-Api-Version: 2026-03-10'
          governance="$RUNNER_TEMP/public-repository-governance"
          mkdir -p "$governance"
          gh api -H "$api_header" "repos/$PUBLIC_REPOSITORY" > "$governance/repository.json"
          gh api -H "$api_header" "repos/$PUBLIC_REPOSITORY/immutable-releases" > "$governance/immutable.json"
          main_ruleset_id="$(gh api -H "$api_header" "repos/$PUBLIC_REPOSITORY/rulesets" --jq 'map(select(.name == "Protect main" and .target == "branch" and .enforcement == "active")) | if length == 1 then .[0].id else empty end')"
          tag_ruleset_id="$(gh api -H "$api_header" "repos/$PUBLIC_REPOSITORY/rulesets" --jq 'map(select(.name == "Protect release tags" and .target == "tag" and .enforcement == "active")) | if length == 1 then .[0].id else empty end')"
          [[ "$main_ruleset_id" =~ ^[0-9]+$ ]]
          [[ "$tag_ruleset_id" =~ ^[0-9]+$ ]]
          gh api -H "$api_header" "repos/$PUBLIC_REPOSITORY/rulesets/$main_ruleset_id" > "$governance/main-ruleset.json"
          gh api -H "$api_header" "repos/$PUBLIC_REPOSITORY/rulesets/$tag_ruleset_id" > "$governance/tag-ruleset.json"
          gh api -H "$api_header" "repos/$PUBLIC_REPOSITORY/branches/main/protection" > "$governance/main-protection.json"
          timeout 30s gh api graphql -f query="$(python3 tools/ci/public_distribution.py ruleset-bypass-query)" > "$governance/ruleset-bypass.json"
          python3 tools/ci/public_distribution.py verify-repository \
            --repository-json "$governance/repository.json" \
            --immutable-json "$governance/immutable.json" \
            --main-ruleset-json "$governance/main-ruleset.json" \
            --tag-ruleset-json "$governance/tag-ruleset.json" \
            --main-protection-json "$governance/main-protection.json" \
            --ruleset-bypass-json "$governance/ruleset-bypass.json"
          if gh release view "$tag" --repo "$PUBLIC_REPOSITORY" >/dev/null 2>&1 || gh api -H "$api_header" "repos/$PUBLIC_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo 'A release or tag already exists in the public repository; create a new patch version.' >&2
            exit 1
          fi
          mapfile -d '' assets < <(find release-bundle -maxdepth 1 -type f -print0 | sort -z)
          test "${#assets[@]}" -eq 16
          created_release_url="$(gh release create "$tag" "${assets[@]}" --repo "$PUBLIC_REPOSITORY" --draft --prerelease --title "Automexia Terminal $tag — Linux Early Access" --notes-file release-bundle/RELEASE-NOTES.md)"
          release_id="$(gh release view "$tag" --repo "$PUBLIC_REPOSITORY" --json databaseId --jq '.databaseId')"
          [[ "$release_id" =~ ^[1-9][0-9]{0,19}$ ]]
          gh api -H "$api_header" "repos/$PUBLIC_REPOSITORY/releases/$release_id" > "$RUNNER_TEMP/release-draft.json"
          python3 tools/ci/public_distribution.py verify-release --manifest release-bundle/public-distribution-manifest-v1.json --release-json "$RUNNER_TEMP/release-draft.json" --release-id "$release_id" --created-url "$created_release_url" --bundle release-bundle --stage draft
          gh api -H "$api_header" --method PATCH "repos/$PUBLIC_REPOSITORY/releases/$release_id" -F draft=false -F prerelease=true -f make_latest=false >/dev/null
          gh api -H "$api_header" "repos/$PUBLIC_REPOSITORY/releases/$release_id" > "$RUNNER_TEMP/release-published.json"
          python3 tools/ci/public_distribution.py verify-release --manifest release-bundle/public-distribution-manifest-v1.json --release-json "$RUNNER_TEMP/release-published.json" --release-id "$release_id" --bundle release-bundle --stage published
          gh release verify "$tag" --repo "$PUBLIC_REPOSITORY" --format json > "$RUNNER_TEMP/release-attestation.json"
          test -s "$RUNNER_TEMP/release-attestation.json"
          for asset in "${assets[@]}"; do
            gh release verify-asset "$tag" "$asset" --repo "$PUBLIC_REPOSITORY" --format json >/dev/null
          done
          mkdir -p activation
          python3 tools/ci/public_distribution.py activation-handoff --manifest release-bundle/public-distribution-manifest-v1.json --output activation/website-activation.json
      - name: Retain exact website activation handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: website-activation-${{ needs.authorize.outputs.version }}
          path: activation/website-activation.json
          if-no-files-found: error
          retention-days: 30
