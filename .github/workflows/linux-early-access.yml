name: Linux Early Access release
run-name: "Linux Early Access · PR #${{ github.event.pull_request.number }} · ${{ github.event.pull_request.head.ref }}"

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  pull-requests: read

env:
  AUTOMEXIA_RUST_TOOLCHAIN: 1.98.0
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  PUBLIC_REPOSITORY: AmjedAllaya/automexia-releases

jobs:
  authorize:
    name: Authorize merged Linux release PR
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'release/linux/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.authorize.outputs.commit }}
      version: ${{ steps.authorize.outputs.version }}
    steps:
      - name: Check out the exact merged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Validate branch, source, and independent approval
        id: authorize
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$PR_BRANCH" =~ ^release/linux/([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || {
            echo 'Linux release branch must be exactly release/linux/X.Y.Z.' >&2
            exit 1
          }
          [[ "$MERGE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MERGED_BY" != "$PR_AUTHOR" ]] || {
            echo 'The release merger must be independent from the pull-request author.' >&2
            exit 1
          }
          approvals="$(
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" |
              python3 tools/ci/check_pr_policy.py --count-approvals "$PR_AUTHOR" "$PR_HEAD_SHA"
          )"
          (( approvals >= 1 )) || { echo 'The exact release head needs a current human approval.' >&2; exit 1; }
          version="${PR_BRANCH#release/linux/}"
          grep -Fq "version = \"$version\"" Cargo.toml || { echo 'Cargo workspace version does not match the release branch.' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$MERGE_COMMIT"
          python3 tools/ci/public_distribution.py check-policy
          python3 tools/ci/test_public_distribution.py
          python3 .github/scripts/check_action_pins.py
          python3 .github/scripts/check_free_plan_contract.py
          echo "commit=$MERGE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  quality:
    name: Linux release quality gate
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.commit }}
      - name: Install pinned Rust and native dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$AUTOMEXIA_RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$AUTOMEXIA_RUST_TOOLCHAIN"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslang-tools libasound2-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-xcb-dev shellcheck zsh fish
      - name: Install pinned quality tools
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026
        with:
          tool: cargo-nextest@0.9.137,cargo-audit@0.22.0,cargo-deny@0.20.2
      - name: Run release-quality checks
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo nextest run --workspace --all-features --locked --profile ci
          cargo test --workspace --all-features --doc --locked
          cargo audit --deny warnings
          cargo deny --locked --color never check --hide-inclusion-graph
          bash tools/ci/test_shell_sources.sh

  package:
    name: Native Linux package build
    needs: [authorize, quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            runner_arch: X64
            target: x86_64-unknown-linux-gnu
            artifact: public-linux-x64
          - runner: ubuntu-22.04-arm
            runner_arch: ARM64
            target: aarch64-unknown-linux-gnu
            artifact: public-linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    env:
      AUTOMEXIA_VERSION: ${{ needs.authorize.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.commit }}
      - name: Require native architecture and install packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ARCH" = "${{ matrix.runner_arch }}"
          rustup toolchain install "$AUTOMEXIA_RUST_TOOLCHAIN" --profile minimal
          rustup default "$AUTOMEXIA_RUST_TOOLCHAIN"
          rustup target add "${{ matrix.target }}"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream cpio desktop-file-utils glslang-tools libasound2-dev libfontconfig1-dev libwayland-dev libx11-xcb-dev libxkbcommon-dev lintian ncurses-bin rpm scdoc
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build, package, and exercise install lifecycle
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p automexia-terminal --target "${{ matrix.target }}"
          binary="target/${{ matrix.target }}/release/automexia"
          "$binary" --version | grep -F "$AUTOMEXIA_VERSION"
          export AUTOMEXIA_PACKAGE_SKIP_BUILD=1
          cargo xtask package --target "${{ matrix.target }}"
          package_dir="target/package/${{ matrix.target }}"
          desktop-file-validate packaging/linux/automexia-terminal.desktop
          appstreamcli validate --no-net packaging/linux/io.github.AmjedAllaya.AutomexiaTerminal.metainfo.xml
          lintian "$package_dir"/*.deb
          bash tools/ci/test_linux_package.sh "$package_dir" "$AUTOMEXIA_VERSION"
          mkdir -p public-packages
          cp "$package_dir"/*.deb "$package_dir"/*.rpm "$package_dir"/*.tar.gz public-packages/
      - name: Upload exact native package set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact }}
          path: public-packages
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  assemble:
    name: Assemble and sign public Linux bundle
    needs: [authorize, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: public-linux-*
          path: package-source
          merge-multiple: true
      - name: Build exact package manifest and public evidence
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.authorize.outputs.commit }}
          RELEASE_MINISIGN_PUBLIC_KEY: ${{ vars.AUTOMEXIA_RELEASE_MINISIGN_PUBLIC_KEY }}
          RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_MINISIGN_PUBLIC_KEY" =~ ^RW[A-Za-z0-9+/=]+$ ]] || { echo 'The minisign public key is missing or invalid.' >&2; exit 1; }
          python3 tools/ci/public_distribution.py build \
            --source package-source \
            --output release-bundle \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT" \
            --copy-packages
          cp docs/public-release/INSTALL.md release-bundle/INSTALL.md
          cp docs/public-release/UNINSTALL.md release-bundle/UNINSTALL.md
          cp docs/public-release/RELEASE-NOTES.md release-bundle/RELEASE-NOTES.md
          cp THIRD_PARTY_NOTICES.md release-bundle/THIRD_PARTY_NOTICES.md
          printf 'untrusted comment: Automexia release verification key\n%s\n' "$RELEASE_MINISIGN_PUBLIC_KEY" > release-bundle/automexia-release-key.pub
          mkdir -p sbom-input/packages
          cp release-bundle/*.deb release-bundle/*.rpm release-bundle/*.tar.gz sbom-input/packages/
          cp Cargo.lock sbom-input/Cargo.lock
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: sbom-input
          format: spdx-json
          output-file: release-bundle/automexia-terminal.spdx.json
          upload-artifact: false
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: sbom-input
          format: cyclonedx-json
          output-file: release-bundle/automexia-terminal.cdx.json
          upload-artifact: false
      - name: Create and verify the detached checksum signature
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.authorize.outputs.commit }}
          RELEASE_MINISIGN_PUBLIC_KEY: ${{ vars.AUTOMEXIA_RELEASE_MINISIGN_PUBLIC_KEY }}
          RELEASE_MINISIGN_SECRET_KEY: ${{ secrets.AUTOMEXIA_RELEASE_MINISIGN_SECRET_KEY }}
          RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          (
            cd release-bundle
            mapfile -t files < <(find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name SHA256SUMS.minisig -printf '%f\n' | LC_ALL=C sort)
            for file in "${files[@]}"; do sha256sum -- "$file"; done > SHA256SUMS
          )
          key="$RUNNER_TEMP/automexia-release.minisign.key"
          cleanup() { rm -f "$key"; }
          trap cleanup EXIT
          umask 077
          printf '%s' "$RELEASE_MINISIGN_SECRET_KEY" | base64 --decode > "$key"
          test -s "$key"
          minisign -S -W -s "$key" -m release-bundle/SHA256SUMS -x release-bundle/SHA256SUMS.minisig -t "Automexia Linux Early Access v$RELEASE_VERSION source $RELEASE_COMMIT"
          minisign -V -P "$RELEASE_MINISIGN_PUBLIC_KEY" -m release-bundle/SHA256SUMS -x release-bundle/SHA256SUMS.minisig
          python3 tools/ci/public_distribution.py verify-bundle --directory release-bundle
      - name: Upload signed create-once bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-linux-release-bundle
          path: release-bundle
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish immutable public Linux prerelease
    needs: [authorize, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: linux-early-access-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: public-linux-release-bundle
          path: release-bundle
      - name: Reverify exact bundle and signature before obtaining write authority
        shell: bash
        env:
          RELEASE_MINISIGN_PUBLIC_KEY: ${{ vars.AUTOMEXIA_RELEASE_MINISIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          python3 tools/ci/public_distribution.py verify-bundle --directory release-bundle
          minisign -V -P "$RELEASE_MINISIGN_PUBLIC_KEY" -m release-bundle/SHA256SUMS -x release-bundle/SHA256SUMS.minisig
      - name: Create repository-scoped one-hour GitHub App token
        id: distribution-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.AUTOMEXIA_DISTRIBUTION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMEXIA_DISTRIBUTION_APP_PRIVATE_KEY }}
          owner: AmjedAllaya
          repositories: automexia-releases
          permission-administration: read
          permission-contents: write
      - name: Publish once, verify the draft, then verify immutable state
        shell: bash
        env:
          GH_TOKEN: ${{ steps.distribution-token.outputs.token }}
          RELEASE_COMMIT: ${{ needs.authorize.outputs.commit }}
          VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          test "$(gh api "repos/$PUBLIC_REPOSITORY" --jq .visibility)" = public
          gh api "repos/$PUBLIC_REPOSITORY/immutable-releases" >/dev/null
          if gh release view "$tag" --repo "$PUBLIC_REPOSITORY" >/dev/null 2>&1 || gh api "repos/$PUBLIC_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo 'A release or tag already exists in the public repository; create a new patch version.' >&2
            exit 1
          fi
          mapfile -d '' assets < <(find release-bundle -maxdepth 1 -type f -print0 | sort -z)
          test "${#assets[@]}" -eq 16
          gh release create "$tag" "${assets[@]}" --repo "$PUBLIC_REPOSITORY" --draft --prerelease --title "Automexia Terminal $tag — Linux Early Access" --notes-file release-bundle/RELEASE-NOTES.md
          gh api "repos/$PUBLIC_REPOSITORY/releases/tags/$tag" > "$RUNNER_TEMP/release-draft.json"
          python3 tools/ci/public_distribution.py verify-release --manifest release-bundle/public-distribution-manifest-v1.json --release-json "$RUNNER_TEMP/release-draft.json" --bundle release-bundle --stage draft
          gh release edit "$tag" --repo "$PUBLIC_REPOSITORY" --draft=false --prerelease --latest=false
          gh api "repos/$PUBLIC_REPOSITORY/releases/tags/$tag" > "$RUNNER_TEMP/release-published.json"
          python3 tools/ci/public_distribution.py verify-release --manifest release-bundle/public-distribution-manifest-v1.json --release-json "$RUNNER_TEMP/release-published.json" --bundle release-bundle --stage published
          mkdir -p activation
          python3 tools/ci/public_distribution.py activation-handoff --manifest release-bundle/public-distribution-manifest-v1.json --output activation/website-activation.json
      - name: Retain exact website activation handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: website-activation-${{ needs.authorize.outputs.version }}
          path: activation/website-activation.json
          if-no-files-found: error
          retention-days: 30
