version: 2
updates:
  - package-ecosystem: cargo
    # Fuzz path dependencies inherit the root workspace manifest. Update both
    # lockfiles in one PR whenever that shared manifest changes.
    directories:
      - /
      - /fuzz
    schedule:
      interval: weekly
      day: monday
    groups:
      cargo:
        patterns: ['*']
      cargo-security:
        applies-to: security-updates
        patterns: ['*']
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']
    open-pull-requests-limit: 5
