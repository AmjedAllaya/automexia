[package]
name = "automexia-ecosystem-runtime"
description = "Private local-package verifier and disabled component host for Automexia."
publish = false
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = []
component-host = ["dep:wasmtime"]

[dependencies]
automexia-ecosystem = { workspace = true }
automexia-devops = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
unicode-normalization = { workspace = true }
wasmtime = { workspace = true, optional = true }
zip = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
wit-parser = { workspace = true }
wat = { workspace = true }

[[bench]]
name = "verification"
harness = false