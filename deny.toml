[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2025-0141", reason = "bincode is transitive through librashader-cache 0.12; no safe upgrade exists and v0.5 must reassess the renderer filter chain" },
  { id = "RUSTSEC-2024-0436", reason = "paste is transitive through the latest baremetal 0.33; replacement requires an upstream baremetal release" },
  { id = "RUSTSEC-2026-0249", reason = "smartstring is transitive through the latest glslang 0.8; replacement requires an upstream glslang/librashader migration" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser replacement with skrifa is an audited renderer migration scheduled for v0.5" },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
# New duplicate dependency versions are errors. The exact compatibility
# versions below form the reviewed v0.4 baseline; removing or changing one
# requires re-running the dependency audit instead of accepting warning noise.
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
skip = [
  # Renderer/shader dependencies currently span librashader and wgpu API generations.
  { crate = "bindgen@0.70.1", reason = "renderer/native build compatibility baseline; converge with the v0.5 renderer upgrade" },
  { crate = "bit-set@0.8.0", reason = "librashader runtime and wgpu require incompatible generations" },
  { crate = "bit-vec@0.8.0", reason = "librashader runtime and wgpu require incompatible generations" },
  { crate = "foldhash@0.1.5", reason = "librashader and wgpu hash-table stacks require incompatible generations" },
  { crate = "halfbrown@0.3.0", reason = "librashader and Sugarloaf require incompatible generations" },
  { crate = "hashbrown@0.14.5", reason = "renderer dependencies require incompatible hashbrown generations" },
  { crate = "hashbrown@0.15.5", reason = "renderer dependencies require incompatible hashbrown generations" },
  { crate = "hashbrown@0.16.1", reason = "renderer dependencies require incompatible hashbrown generations" },
  { crate = "rustc-hash@1.1.0", reason = "wgpu/naga and application crates require incompatible generations" },

  # Font stacks are intentionally dual-generation until the audited v0.5 skrifa migration.
  { crate = "font-types@0.10.1", reason = "Rio font metrics and swash require incompatible font-stack generations" },
  { crate = "read-fonts@0.35.0", reason = "Rio font metrics and swash require incompatible font-stack generations" },
  { crate = "skrifa@0.37.0", reason = "Rio font metrics and swash require incompatible font-stack generations" },

  # Cross-platform windowing backends retain compatibility versions for supported targets.
  { crate = "bitflags@1.3.2", reason = "inherited platform backends still expose the bitflags 1 API" },
  { crate = "block2@0.5.1", reason = "macOS dependencies require incompatible Objective-C runtime generations" },
  { crate = "calloop@0.13.0", reason = "Wayland dependencies require incompatible event-loop generations" },
  { crate = "calloop-wayland-source@0.3.0", reason = "Wayland dependencies require incompatible event-loop generations" },
  { crate = "core-foundation@0.9.4", reason = "macOS renderer and window dependencies require incompatible generations" },
  { crate = "core-graphics@0.23.2", reason = "macOS renderer and window dependencies require incompatible generations" },
  { crate = "core-graphics-types@0.1.3", reason = "macOS renderer and window dependencies require incompatible generations" },
  { crate = "core-text@20.1.0", reason = "macOS font dependencies require incompatible generations" },
  { crate = "malloc_buf@0.0.6", reason = "legacy macOS compatibility dependency" },
  { crate = "miow@0.5.0", reason = "corcovado and the current ConPTY layer require incompatible generations" },
  { crate = "ndk@0.8.0", reason = "Android transitive backends require incompatible NDK generations" },
  { crate = "ndk-sys@0.5.0+25.2.9519653", reason = "Android transitive backends require incompatible NDK generations" },
  { crate = "objc-rs@0.2.8", reason = "macOS transitive backends require incompatible Objective-C generations" },
  { crate = "objc2@0.5.2", reason = "macOS transitive backends require incompatible Objective-C generations" },
  { crate = "objc2-app-kit@0.2.2", reason = "macOS transitive backends require incompatible Objective-C generations" },
  { crate = "objc2-foundation@0.2.2", reason = "macOS transitive backends require incompatible Objective-C generations" },
  { crate = "redox_syscall@0.4.1", reason = "Redox transitive backends require incompatible syscall generations" },
  { crate = "redox_syscall@0.5.18", reason = "Redox transitive backends require incompatible syscall generations" },
  { crate = "redox_users@0.4.6", reason = "Redox transitive backends require incompatible user-database generations" },
  { crate = "rustix@0.38.44", reason = "Unix transitive backends require incompatible rustix generations" },
  { crate = "smithay-client-toolkit@0.19.2", reason = "Wayland transitive backends require incompatible toolkit generations" },

  # Widely used foundational crates have incompatible semver requirements in the inherited graph.
  { crate = "cpufeatures@0.2.17", reason = "crypto and system dependencies require incompatible generations" },
  { crate = "getrandom@0.2.17", reason = "transitive dependencies require pre-1.0 incompatible generations" },
  { crate = "getrandom@0.3.4", reason = "transitive dependencies require pre-1.0 incompatible generations" },
  { crate = "linux-raw-sys@0.4.15", reason = "Unix dependencies require incompatible system-interface generations" },
  { crate = "linux-raw-sys@0.9.4", reason = "Unix dependencies require incompatible system-interface generations" },
  { crate = "nom@7.1.3", reason = "parser dependencies require incompatible major versions" },
  { crate = "r-efi@5.3.0", reason = "getrandom compatibility generations require different EFI bindings" },
  { crate = "rand@0.8.7", reason = "renderer cache dependencies require incompatible random APIs" },
  { crate = "rand_core@0.6.4", reason = "renderer cache dependencies require incompatible random APIs" },
  { crate = "shlex@1.3.0", reason = "native build dependencies require incompatible parser generations" },
  { crate = "syn@2.0.119", reason = "procedural macro dependencies require incompatible major versions" },
  { crate = "thiserror@1.0.69", reason = "transitive dependencies require incompatible error APIs" },
  { crate = "thiserror-impl@1.0.69", reason = "transitive dependencies require incompatible error APIs" },
  { crate = "tiny-skia@0.11.4", reason = "renderer and window dependencies require incompatible raster generations" },
  { crate = "tiny-skia-path@0.11.4", reason = "renderer and window dependencies require incompatible raster generations" },
  { crate = "toml@0.5.11", reason = "shader preset parsing and application config require incompatible TOML APIs" },
  { crate = "toml_datetime@0.7.5+spec-1.1.0", reason = "TOML transitive dependencies require incompatible generations" },
  { crate = "winnow@0.7.15", reason = "TOML transitive dependencies require incompatible parser generations" },

  # windows-rs releases intentionally version their complete target-binding family together.
  { crate = "windows@0.54.0", reason = "Windows transitive dependencies require incompatible windows-rs generations" },
  { crate = "windows-core@0.54.0", reason = "Windows transitive dependencies require incompatible windows-rs generations" },
  { crate = "windows-result@0.1.2", reason = "Windows transitive dependencies require incompatible windows-rs generations" },
  { crate = "windows-sys@0.42.0", reason = "Windows transitive dependencies require incompatible windows-sys generations" },
  { crate = "windows-sys@0.45.0", reason = "Windows transitive dependencies require incompatible windows-sys generations" },
  { crate = "windows-sys@0.52.0", reason = "Windows transitive dependencies require incompatible windows-sys generations" },
  { crate = "windows-sys@0.59.0", reason = "Windows transitive dependencies require incompatible windows-sys generations" },
  { crate = "windows-sys@0.60.2", reason = "Windows transitive dependencies require incompatible windows-sys generations" },
  { crate = "windows-targets@0.42.2", reason = "windows-sys compatibility family" },
  { crate = "windows-targets@0.52.6", reason = "windows-sys compatibility family" },
  { crate = "windows_aarch64_gnullvm@0.42.2", reason = "windows-targets compatibility family" },
  { crate = "windows_aarch64_gnullvm@0.52.6", reason = "windows-targets compatibility family" },
  { crate = "windows_aarch64_msvc@0.42.2", reason = "windows-targets compatibility family" },
  { crate = "windows_aarch64_msvc@0.52.6", reason = "windows-targets compatibility family" },
  { crate = "windows_i686_gnu@0.42.2", reason = "windows-targets compatibility family" },
  { crate = "windows_i686_gnu@0.52.6", reason = "windows-targets compatibility family" },
  { crate = "windows_i686_gnullvm@0.52.6", reason = "windows-targets compatibility family" },
  { crate = "windows_i686_msvc@0.42.2", reason = "windows-targets compatibility family" },
  { crate = "windows_i686_msvc@0.52.6", reason = "windows-targets compatibility family" },
  { crate = "windows_x86_64_gnu@0.42.2", reason = "windows-targets compatibility family" },
  { crate = "windows_x86_64_gnu@0.52.6", reason = "windows-targets compatibility family" },
  { crate = "windows_x86_64_gnullvm@0.42.2", reason = "windows-targets compatibility family" },
  { crate = "windows_x86_64_gnullvm@0.52.6", reason = "windows-targets compatibility family" },
  { crate = "windows_x86_64_msvc@0.42.2", reason = "windows-targets compatibility family" },
  { crate = "windows_x86_64_msvc@0.52.6", reason = "windows-targets compatibility family" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
