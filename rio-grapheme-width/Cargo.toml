[package]
name = "rio-grapheme-width"
publish = false
# Maintained Rio library identity, independent of the application release.
version = "0.4.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Emoji presentation and variation-sequence tables for Rio terminal. Forked from wezterm-char-props."

[dependencies]
# Generate hash layout with the same reviewed PHF version used for lookups.
# Unicode entry data remains checked in; no runtime generation is performed.
phf = { version = "=0.14.0", features = ["macros"], default-features = false }
ucd-trie = { version = "0.1.7", default-features = false }

[features]
default = ["std"]
std = ["ucd-trie/std", "phf/std"]
