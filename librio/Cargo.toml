[package]
name = "librio"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
keywords.workspace = true
repository = "https://github.com/raphamorim/rio"
description = "Embeddable terminal core extracted from Rio: PTY, VT state, render-state pull API, exposed as a C ABI"
readme = "README.md"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "automexia-vscode-host"
path = "src/bin/automexia-vscode-host.rs"
required-features = ["vscode-host"]

[dependencies]
automexia-extension-api = { workspace = true, optional = true }
automexia-ui-model = { workspace = true, optional = true }
rio-vt = { path = "../rio-vt", version = "0.4.0", default-features = false }
rio-fonts = { workspace = true, features = ["symbols-nerd-font"] }
rio-graphics = { workspace = true }
rustc-hash = { workspace = true }
bitflags = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
teletypewriter = { workspace = true, optional = true }
corcovado = { workspace = true, optional = true }

[features]
# PTY on by default: surfaces spawn a shell and pump it on an IO thread.
# Without it (the wasm/web build) the host is the transport: bytes the
# terminal wants sent to the child go to `SurfaceDelegate::output`, and
# child output comes back in through `Surface::feed`.
default = ["pty", "graphics"]
pty = ["rio-vt/pty", "dep:teletypewriter", "dep:corcovado"]
# Image decode (png/jpeg/webp/...) and glyph-protocol font parsing for
# kitty graphics. Off in the wasm/web build: the codecs and font
# machinery are most of the binary, and the protocol paths still parse
# without them; only pixel decode is stubbed out.
graphics = ["rio-vt/graphics"]
vscode-host = ["pty", "dep:automexia-extension-api", "dep:automexia-ui-model", "dep:serde", "dep:serde_json"]
