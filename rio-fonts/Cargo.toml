[package]
name = "rio-fonts"
publish = false
# Maintained Rio library identity, independent of the application release.
version = "0.4.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
keywords.workspace = true
repository = "https://github.com/raphamorim/rio"
description = "Font assets and glyph placement rules shared by Rio's renderers (Nerd Font constraint table, embedded symbols fallback)"

[dependencies]

[dev-dependencies]
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }

[features]
default = []
# Embed the symbols-only Nerd Font (~1.9 MB) for renderers that want a
# guaranteed icon-glyph fallback without shipping a font file.
symbols-nerd-font = []
