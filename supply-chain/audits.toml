[[audits.secret-service]]
who = "Automexia automated source review"
criteria = "safe-to-deploy"
version = "5.2.0"
notes = """
Automated source review of the exact checksummed crates.io archive, including production Rust, manifests and relevant tests/native/build inputs. This is not a human or formal cryptographic audit. Reviewed async/blocking D-Bus paths, encrypted-session negotiation, secret encoding, locks/prompts and powerful imports. The session bus and selected credential provider are trusted; DH is not provider authentication. Callers own deadlines, lock verification and prompt policy. Protocol arithmetic is variable-time and provider outputs are not an arbitrary untrusted cryptographic peer boundary. Source review does not establish native provider behavior.
