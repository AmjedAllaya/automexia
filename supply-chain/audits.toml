[[audits.atspi-common]]
who = "Automexia automated source review"
criteria = "safe-to-deploy"
version = "0.13.0"
notes = """
Automated source review of the exact Cargo.lock-checksummed crates.io archive and manifest; extracted source bytes were also verified. This is not an independent human audit or native accessibility certification. Reviewed typed roles/states/interfaces, cache and event wire models, object references and serialization/error paths. Found an assertion when decoding a non-null ObjectRef with an empty bus name. Automexia avoids that deserializer for its sole incoming reference (Socket.Embed), validates OwnedUniqueName/OwnedObjectPath through zbus, and tests malformed and valid encoded replies. Other ObjectRef values are application-authored outbound data. Generic event clone/allocation APIs still require caller resource bounds; this record does not endorse unrestricted decoding of arbitrary peer event trees.
"""

[[audits.atspi-proxies]]
who = "Automexia automated source review"
criteria = "safe-to-deploy"
version = "0.13.0"
notes = """
Automated source review of the exact Cargo.lock-checksummed crates.io archive and manifest; extracted source bytes were also verified. This is not an independent human audit or native accessibility certification. Reviewed generated proxy traits, interface/destination declarations, typed argument/reply contracts and ProxyExt connection/path reuse. Automexia uses system accessibility bus/status/socket operations, not a new authentication owner. The local adapter bypasses the Socket.Embed ObjectRef reply decoder with checked zbus wire fields because the transitive decoder asserts on malformed input. Bus/provider work stays on the bounded adapter worker.
"""

