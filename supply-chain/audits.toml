[[audits.chacha20poly1305]]
who = "Automexia automated source review"
criteria = "safe-to-deploy"
version = "0.11.0"
notes = """
Automated source review of the exact checksummed crates.io archive, including production Rust, manifests and relevant tests/native/build inputs. This is not a human or formal cryptographic audit. Reviewed authentication-before-decryption, tag comparison, counter separation and XChaCha key derivation. Caller must ensure nonce uniqueness, bound allocation and stream length, and discard failed mutable-buffer operations. This is not a panic-free API certification. Zeroization of Poly1305 requires its separate feature.
"""

