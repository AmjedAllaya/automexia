[[audits.serde-saphyr]]
who = "Automexia automated source review"
criteria = "safe-to-deploy"
delta = "1.1.0 -> 1.3.0"
notes = """
Automated review of the checksummed crates.io delta for Automexia's deserialize-only feature set, manifests and relevant tests. Reviewed alias replay/recursion, retained event and owned-payload charging before clones, tag/null/merge-key handling, mapping completion, numeric key normalization and diagnostic escaping. Include, filesystem resolver, properties, serialization, CLI and validation integrations remain disabled and are outside this review. No build script or production unsafe code in the selected configuration. The caller explicitly caps retained copies and drops diagnostics that might contain credentials. This is an automated, feature-scoped review, not an independent human audit; enabling other features requires a new review.
"""

[[audits.smallvec]]
who = "Automexia automated source review"
criteria = "safe-to-deploy"
delta = "1.16.0 -> 1.16.2"
notes = """
Automated source delta review: inspected ownership PhantomData, inline/spilled push transitions and retain's panic guard. The read/write positions remain within the original initialized range; removed elements are marked consumed before dropping, retained values move only into earlier holes, and the guard restores the unprocessed tail on unwind. Zero-sized types and predicate/destructor panic regressions are covered by upstream tests. Used by the fuzz workspace. This is not a formal unsafe-code proof.
"""

