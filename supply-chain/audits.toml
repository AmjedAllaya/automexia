
# cargo-vet audits file

[[audits.accesskit]]
who = "Automexia automated source review"
criteria = "safe-to-deploy"
version = "0.25.1"
notes = """
Automated source review of the exact Cargo.lock-checksummed crates.io archive and manifest; extracted source bytes were also verified. This is not an independent human audit or native accessibility certification. Reviewed the role/action schema, property indexing and replacement, node relationships, text metadata and geometry operations. This is an in-memory model with no process/provider I/O. The application constructs nodes through its bounded, acyclic semantic projection; it does not deserialize foreign trees. Finite geometry, text budgets and valid character-byte ranges remain caller invariants.
"""

[[audits.accesskit_atspi_common]]
who = "Automexia automated source review"
criteria = "safe-to-deploy"
version = "0.21.0"
notes = """
Automated source review of the exact Cargo.lock-checksummed crates.io archive and manifest; extracted source bytes were also verified. This is not an independent human audit or native accessibility certification. Reviewed weak-context lifetime, node lookups, role/state and interface mapping, cache/event construction, text positions and action forwarding; compared the disabled-state fixes with 0.20.0. Automexia bounds trees and adapter queues. The local Unix boundary additionally rejects disabled/read-only or oversized text replacements before this crate copies them. Application action dispatch accepts only its declared current-focus action; arbitrary provider actions do not become terminal input.
"""

[[audits.accesskit_consumer]]
who = "Automexia automated source review"
criteria = "safe-to-deploy"
version = "0.39.1"
notes = """
Automated source review of the exact Cargo.lock-checksummed crates.io archive and manifest; extracted source bytes were also verified. This is not an independent human audit or native accessibility certification. Reviewed tree updates/grafting, duplicate and focus invariants, change notifications, node filters, text-range positions and Unicode offset conversion. Malformed host-authored trees may assert; Automexia validates parent-first acyclic trees, unique identities, finite bounds and bounded text before publication. Native node references are generation/lifetime checked. No foreign tree payload is accepted into this consumer.
"""

