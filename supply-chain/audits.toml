
# cargo-vet audits file

[[audits.aead]]
who = "Automexia automated source review"
criteria = "safe-to-deploy"
version = "0.6.1"
notes = """
Automated source review of the exact checksummed crates.io archive, including production Rust, manifests and relevant tests/native/build inputs. This is not a human or formal cryptographic audit. Reviewed buffer contracts and allocation/error paths. Consumers must bound allocations; arbitrary custom Buffer implementations are caller code, not untrusted data.
"""

