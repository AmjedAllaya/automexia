schema_version = 1
revision = 0

[[actions]]
id = "cloud.login"
display_name = "Cloud login"
scope = "global-user"
shells = ["zsh"]
risk = "read-only"
[actions.template]
kind = "typed-argv"
executable_id = "cloudctl"
arguments = [{ kind = "placeholder", name = "token" }]
[[actions.placeholders]]
name = "token"
prompt = "Credential reference"
sensitivity = "secret-reference"
[actions.alias_projection]
requested_name = "cl"
shells = ["zsh"]
mode = "wrapper-function"
